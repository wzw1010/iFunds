<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>iFunds</title>
    <link rel="manifest" href="./manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="iFunds" />
    <link rel="apple-touch-icon" href="./icon-1024.png" />
    <meta name="theme-color" content="#0b1a33" />
    <style>
        :root {
            --radius-md: 20px;
            --radius-sm: 12px;
            --radius-full: 50%;
            --color-bg: #f2f5fc;
            --color-card-bg: #ffffff;
            --color-primary: #0b1a33;
            --color-primary-light: #132b4a;
            --color-text: #0b1a33;
            --color-text-secondary: #6b7d98;
            --color-text-light: #94a3b8;
            --color-border: #eef2f8;
            --color-positive: #E63946;
            --color-negative: #2A9D8F;
            --color-neutral: #94a3b8;
            --color-edit-border: #d0d8e0;
            --color-edit-bg: #f8fafc;
            --shadow-card: 0 4px 16px rgba(0,0,0,0.08);
            --shadow-summary: 0 6px 24px rgba(0,0,0,0.12);
            --decor-today: #0b1a33;
            --decor-old: #b8c8d8;
        }
        * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }

        html, body {
            width:100%;
            min-height:100vh;
            background:var(--color-bg);
            display:flex;
            justify-content:center;
            padding:4px;
            overflow-y:auto;
            -webkit-overflow-scrolling:touch;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        body::-webkit-scrollbar { display: none; }

        .app-container {
            max-width:480px;
            width:100%;
            background:#ffffff;
            border-radius:var(--radius-md);
            box-shadow:0 8px 32px rgba(0,0,0,0.05);
            padding:14px 14px 10px 14px;
            display:flex;
            flex-direction:column;
            align-self:flex-start;
            gap:14px;
        }

        .summary-card { background:linear-gradient(145deg,var(--color-primary),var(--color-primary-light)); border-radius:var(--radius-md); padding:10px 14px 8px 14px; color:white; flex-shrink:0; box-shadow:var(--shadow-summary); }
        .summary-today { display:flex; flex-direction:column; align-items:center; margin-bottom:6px; }
        .summary-today .today-label { font-size:13px; font-weight:500; opacity:0.7; letter-spacing:0.3px; display:flex; align-items:center; gap:6px; }
        .summary-today .today-label svg { width:16px; height:16px; stroke:rgba(255,255,255,0.7); stroke-width:2; fill:none; }
        .summary-today .today-value { font-size:22px; font-weight:700; letter-spacing:-0.5px; line-height:1.2; margin-top:0px; }
        .summary-today .today-value.positive { color:var(--color-positive); }
        .summary-today .today-value.negative { color:var(--color-negative); }
        .summary-today .today-value.neutral { color:var(--color-text-light); }
        .summary-today .today-value.privacy { color:var(--color-text-light); letter-spacing:4px; }
        .summary-divider { border:none; border-top:1px solid rgba(255,255,255,0.10); margin:0 0 6px 0; }
        .summary-stats { display:flex; justify-content:space-between; align-items:center; }
        .summary-stat-item { display:flex; flex-direction:column; align-items:center; flex:1; position:relative; gap:2px; }
        .summary-stat-item:not(:last-child)::after { content:''; position:absolute; right:0; top:15%; height:70%; width:1px; background:rgba(255,255,255,0.12); }
        .summary-stat-item .stat-label-wrap { display:flex; align-items:center; gap:4px; }
        .summary-stat-item .stat-label { font-size:10px; opacity:0.5; font-weight:500; text-transform:uppercase; letter-spacing:0.5px; white-space:nowrap; }
        .summary-stat-item .stat-number { font-size:14px; font-weight:600; line-height:1.3; }
        .summary-stat-item .stat-number.privacy { letter-spacing:3px; color:var(--color-text-light) !important; }
        .stat-number.positive { color:var(--color-positive); }
        .stat-number.negative { color:var(--color-negative); }
        .stat-number.neutral { color:var(--color-text-light); }
        .data-timestamp { font-size:10px; opacity:0.5; text-align:center; margin-top:4px; letter-spacing:0.3px; }

        .fund-list { display:flex; flex-direction:column; gap:5px; flex:1; }

        .fund-card { background:var(--color-card-bg); border-radius:var(--radius-md); padding:10px 14px 12px 14px; border:1px solid var(--color-border); box-shadow:var(--shadow-card); display:flex; flex-direction:column; gap:8px; flex-shrink:0; transition:box-shadow 0.2s,border-color 0.3s; position:relative; overflow:hidden; }
        .fund-card:active { box-shadow:0 2px 8px rgba(0,0,0,0.04); background:#fafcff; }
        .fund-card::before { content:''; position:absolute; left:0; top:0; bottom:0; width:4px; border-radius:0; transition:background 0.4s ease; }
        .fund-card.decor-today::before { background:var(--decor-today); }
        .fund-card.decor-old::before { background:var(--decor-old); }
        .fund-card.flash-update { animation:flashCard 0.6s ease; }
        @keyframes flashCard { 0% { background:#f0f7ff; } 50% { background:#e0edf9; } 100% { background:var(--color-card-bg); } }

        .fund-row-top {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            align-items: center;
            height: 30px;
            padding-left: 10px;
            column-gap: 0;
        }
        .fund-name-wrap { grid-column: 1 / 3; min-width:0; overflow:hidden; padding-right:4px; }
        .fund-name { font-size:14px; font-weight:600; color:var(--color-text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block; }
        .fund-code-wrap { grid-column:3; display:flex; justify-content:center; align-items:center; }
        .fund-code-standalone { display:inline-block; font-weight:400; font-size:10px; color:var(--color-text-secondary); background:#f0f4fc; padding:0 8px; border-radius:var(--radius-md); line-height:18px; text-align:center; }
        .fund-right-actions { grid-column:4; display:flex; align-items:center; justify-content:flex-end; white-space:nowrap; }
        .fund-market-value { font-size:14px; font-weight:600; color:var(--color-text); display:flex; align-items:center; gap:3px; }
        .coin-icon { font-size:12px; color:var(--color-text-secondary); opacity:0.7; }  /* Font Awesome 样式 */

        .fund-row-metrics { display:flex; align-items:stretch; padding-left:10px; height:40px; position:relative; }
        .edit-mode .fund-row-metrics { display:none; }
        .metric-item { flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding:2px 0; position:relative; min-width:0; }
        .metric-item:not(:last-child)::after { content:''; position:absolute; right:0; top:10%; height:80%; width:1px; background:#e0e5ed; }
        .metric-item .metric-label { font-size:9px; font-weight:500; color:var(--color-text-light); letter-spacing:0.2px; text-transform:uppercase; line-height:1.2; }
        .metric-item .metric-value { font-size:13px; font-weight:600; line-height:1.3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .metric-item .metric-value.positive { color:var(--color-positive); }
        .metric-item .metric-value.negative { color:var(--color-negative); }
        .metric-item .metric-value.neutral { color:var(--color-text-light); }
        .fund-edit-area { display:none; padding:8px 0 2px 10px; border-top:1px dashed var(--color-border); flex-direction:column; gap:6px; }
        .fund-edit-area.active { display:flex; }
        .edit-row { display:flex; gap:8px; align-items:center; width:100%; flex-wrap:nowrap; }
        .edit-row .edit-input { flex:1; min-width:0; height:38px; padding:6px 10px; font-size:13px; font-family:inherit; border-radius:var(--radius-sm); border:1px solid var(--color-edit-border); background:var(--color-edit-bg); color:var(--color-text); outline:none; transition:border 0.2s ease; -webkit-appearance:none; }
        .edit-row .edit-input:focus { border-color:var(--color-primary); box-shadow:0 0 0 2px rgba(11,26,51,0.08); }
        .edit-row .edit-input::placeholder { color:var(--color-text-light); opacity:0.6; }
        .edit-row .edit-delete-btn { flex:0 0 auto; height:38px; padding:0 14px; font-size:12px; font-weight:600; font-family:inherit; border:none; border-radius:var(--radius-sm); background:var(--color-positive); color:#fff; cursor:pointer; transition:opacity 0.2s ease; white-space:nowrap; }
        .edit-row .edit-delete-btn:active { opacity:0.6; transform:scale(0.96); }
        .edit-hint { font-size:11px; color:var(--color-text-light); display:flex; justify-content:space-between; align-items:center; padding:0 2px; }
        .edit-hint .current-cost { font-weight:500; color:var(--color-text-secondary); }
        .empty-state { text-align:center; padding:40px 20px; color:var(--color-text-secondary); }
        .empty-state i { font-size:36px; color:#d5dde8; margin-bottom:6px; }
        .empty-state p { font-size:14px; font-weight:500; }
        .empty-state .sub { font-size:12px; opacity:0.6; margin-top:2px; }

        .bottom-action-card {
            background:linear-gradient(145deg,var(--color-primary),var(--color-primary-light));
            border-radius:var(--radius-md);
            padding:10px 6px;
            border:1px solid rgba(255,255,255,0.15);
            box-shadow:0 8px 32px rgba(0,0,0,0.12);
            display:flex;
            align-items:stretch;
            position:relative;
            overflow:hidden;
            flex-shrink:0;
            margin-top:1px;
            transition:all 0.3s ease;
            justify-content:center;
            min-height:72px;
        }
        .bottom-action-card::before { content:''; position:absolute; top:-50%; left:-50%; width:200%; height:200%; background:radial-gradient(ellipse at 30% 20%, rgba(255,255,255,0.08) 0%, transparent 60%); pointer-events:none; }
        .action-btn { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; padding:6px 4px; cursor:pointer; transition:background 0.2s ease; border:none; background:transparent; color:#ffffff; position:relative; border-radius:var(--radius-md); min-height:52px; -webkit-tap-highlight-color:transparent; touch-action:manipulation; user-select:none; }
        .action-btn:not(:last-child)::after { content:''; position:absolute; right:0; top:15%; height:70%; width:1px; background:rgba(255,255,255,0.12); }
        .action-btn:active { background:rgba(255,255,255,0.06); transform:scale(0.96); }
        .action-btn .icon-wrap { width:28px; height:28px; border-radius:var(--radius-full); background:rgba(255,255,255,0.12); backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; font-size:14px; color:#ffffff; flex-shrink:0; border:1px solid rgba(255,255,255,0.08); transition:background 0.2s; will-change:transform; pointer-events:none; }
        @keyframes iconPop { 0% { transform:scale(1); } 35% { transform:scale(1.3); } 60% { transform:scale(0.92); } 100% { transform:scale(1); } }
        .action-btn .icon-wrap.pop { animation:iconPop 0.4s cubic-bezier(0.34,1.56,0.64,1); }
        .action-btn .label { font-size:10px; font-weight:500; color:rgba(255,255,255,0.75); letter-spacing:0.2px; white-space:nowrap; pointer-events:none; }
        .bottom-action-card.edit-mode .action-btn { display:none !important; }
        .bottom-action-card.edit-mode .action-btn.edit-highlight { display:flex !important; flex:0 0 auto; padding:8px 28px; background:transparent !important; border-radius:var(--radius-md); }
        .bottom-action-card.edit-mode .action-btn.edit-highlight .icon-wrap { background:rgba(255,255,255,0.12); border-color:rgba(255,255,255,0.08); }
        .bottom-action-card.edit-mode .action-btn.edit-highlight .label { color:rgba(255,255,255,0.75); }
        .bottom-action-card.edit-mode .action-btn::after { display:none !important; }

        .modal-overlay {
            display:none;
            position:fixed;
            inset:0;
            background:rgba(0,0,0,0.25);
            backdrop-filter:blur(16px);
            -webkit-backdrop-filter:blur(16px);
            justify-content:center;
            align-items:center;
            z-index:999;
            padding:0;
            box-sizing:border-box;
        }
        .modal-overlay.active { display:flex; }
        .add-modal .add-content, .backup-modal .backup-content { display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:32px 24px; width:100%; height:100%; max-width:100%; max-height:100%; background:rgba(255,255,255,0.06); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px); border-radius:0; border:none; box-shadow:none; position:relative; }
        .add-modal .add-content h2, .backup-modal .backup-content h2 { font-size:22px; font-weight:700; color:#0b1a33; display:flex; align-items:center; gap:8px; margin-bottom:0px; }
        .add-modal .add-content h2 i, .backup-modal .backup-content h2 i { color:#0b1a33; }
        .sub-placeholder { height:24px; flex-shrink:0; }
        .add-modal .add-content .input-group { width:100%; display:flex; flex-direction:column; gap:12px; margin-bottom:16px; }
        .add-modal .add-content .input-group input { width:100%; padding:12px 16px; border-radius:var(--radius-md); border:1px solid rgba(255,255,255,0.2); background:rgba(255,255,255,0.12); backdrop-filter:blur(4px); font-size:15px; color:#ffffff; outline:none; transition:0.15s; -webkit-appearance:none; }
        .add-modal .add-content .input-group input::placeholder { color:rgba(255,255,255,0.4); font-weight:400; font-size:14px; }
        .add-modal .add-content .input-group input:focus { border-color:rgba(255,255,255,0.5); background:rgba(255,255,255,0.2); }
        .add-modal .add-content .auto-fill-info { width:100%; background:rgba(255,255,255,0.1); border-radius:var(--radius-md); padding:8px 14px; font-size:13px; color:rgba(255,255,255,0.85); border:1px solid rgba(255,255,255,0.1); display:none; margin-top:-6px; margin-bottom:2px; text-align:center; }
        .add-modal .add-content .auto-fill-info.show { display:block; }
        .add-modal .add-content .modal-actions { display:flex; gap:12px; width:100%; justify-content:center; margin-top:12px; }
        .add-modal .add-content .modal-actions button { flex:1; padding:12px 16px; border-radius:var(--radius-md); font-size:15px; font-weight:600; border:1px solid rgba(255,255,255,0.1); cursor:pointer; transition:0.15s; background:rgba(255,255,255,0.15); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); color:#ffffff; }
        .add-modal .add-content .modal-actions button:active { background:rgba(255,255,255,0.25); transform:scale(0.96); }
        .add-modal .add-content .modal-actions .btn-cancel { background:rgba(255,255,255,0.15); color:#ffffff; border:1px solid rgba(255,255,255,0.1); }
        .add-modal .add-content .modal-actions .btn-confirm:disabled { opacity:0.4; cursor:not-allowed; }
        .backup-modal .backup-actions { display:flex; flex-direction:column; gap:10px; width:100%; }
        .backup-modal .backup-actions button, .backup-modal .backup-actions .file-input-wrap { width:100%; border-radius:var(--radius-md); border:1px solid rgba(255,255,255,0.1); background:rgba(255,255,255,0.15); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; gap:6px; text-align:center; line-height:1.3; transition:0.15s; cursor:pointer; padding:14px 16px; font-size:16px; font-weight:600; color:#ffffff; }
        .backup-modal .backup-actions .file-input-wrap { padding:0; position:relative; overflow:hidden; }
        .backup-modal .backup-actions .file-input-wrap button { width:100%; height:100%; padding:14px 16px; font-size:16px; font-weight:600; color:#ffffff; background:transparent; border:none; backdrop-filter:none; display:flex; align-items:center; justify-content:center; gap:6px; cursor:pointer; }
        .backup-modal .backup-actions .file-input-wrap input[type="file"] { position:absolute; left:0; top:0; opacity:0; width:100%; height:100%; cursor:pointer; }
        .backup-modal .backup-actions button:active, .backup-modal .backup-actions .file-input-wrap:active { background:rgba(255,255,255,0.25); transform:scale(0.96); }
        .modal-close-btn { position:absolute; bottom:48px; left:50%; transform:translateX(-50%); width:48px; height:48px; border-radius:var(--radius-full); background:rgba(255,255,255,0.15); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); border:1px solid rgba(255,255,255,0.2); display:flex; align-items:center; justify-content:center; cursor:pointer; transition:0.2s; color:rgba(255,255,255,0.7); font-size:18px; z-index:10; }
        .modal-close-btn:active { transform:translateX(-50%) scale(0.88); background:rgba(255,255,255,0.25); }
        .modal-close-btn svg { width:24px; height:24px; stroke:rgba(255,255,255,0.7); stroke-width:2; fill:none; }
        .prompt-modal .prompt-content { display:flex; flex-direction:column; align-items:center; text-align:center; padding:24px; width:100%; max-width:340px; background:rgba(255,255,255,0.08); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border-radius:var(--radius-md); border:none; }
        .prompt-modal .prompt-content h2 { font-size:18px; font-weight:700; color:#ffffff; margin-bottom:6px; }
        .prompt-modal .prompt-content .prompt-message { font-size:15px; color:rgba(255,255,255,0.85); line-height:1.5; margin-bottom:18px; }
        .prompt-modal .prompt-content .modal-actions { display:flex; gap:10px; width:100%; justify-content:center; }
        .prompt-modal .prompt-content .modal-actions button { flex:1; padding:12px; border-radius:var(--radius-md); font-size:15px; font-weight:600; border:none; cursor:pointer; transition:0.15s; max-width:140px; }
        .prompt-modal .prompt-content .modal-actions .btn-cancel { background:rgba(255,255,255,0.15); color:#ffffff; border:1px solid rgba(255,255,255,0.1); }
        .prompt-modal .prompt-content .modal-actions .btn-cancel:active { background:rgba(255,255,255,0.25); }
        .prompt-modal .prompt-content .modal-actions .btn-confirm { background:#ffffff; color:#0b1a33; }
        .prompt-modal .prompt-content .modal-actions .btn-confirm:active { background:#e8edf5; }
        .prompt-modal .prompt-content .modal-actions .btn-danger { background:var(--color-positive); color:#ffffff; }
        .prompt-modal .prompt-content .modal-actions .btn-danger:active { background:#c92a3a; }
        .refresh-loading { pointer-events:none; opacity:0.6; }
        .refresh-loading i { animation:spin 1s infinite linear; }
        @keyframes spin { 0% { transform:rotate(0deg); } 100% { transform:rotate(360deg); } }
        .check-pop { position:fixed; top:50%; left:50%; transform:translate(-50%, -50%) scale(0); width:80px; height:80px; background:linear-gradient(145deg,#0b1a33,#132b4a); border-radius:50%; display:flex; align-items:center; justify-content:center; transition:transform 0.35s ease-out; z-index:200; pointer-events:none; box-shadow:0 6px 24px rgba(11,26,51,0.3); }
        .check-pop.show { transform:translate(-50%, -50%) scale(1); }
        .check-pop svg { width:44px; height:44px; stroke:white; stroke-width:3; fill:none; }

        @media (max-width:420px) {
            .app-container { padding:10px 12px 10px 12px; }
            .summary-card { padding:8px 12px 6px 12px; }
            .summary-today .today-value { font-size:20px; }
            .summary-today .today-label { font-size:12px; }
            .summary-stat-item .stat-number { font-size:13px; }
            .summary-stat-item .stat-label { font-size:9px; }
            .fund-card { padding:8px 10px 10px 10px; gap:6px; }
            .fund-row-top { height:26px; padding-left:6px; }
            .fund-name { font-size:13px; }
            .fund-code-standalone { font-size:9px; padding:0 6px; }
            .fund-market-value { font-size:12px; }
            .coin-icon { font-size:11px; }
            .fund-row-metrics { padding-left:6px; height:36px; }
            .metric-item .metric-label { font-size:8px; }
            .metric-item .metric-value { font-size:11px; }
            .fund-edit-area { padding:6px 0 2px 6px; }
            .edit-row .edit-input { height:34px; font-size:12px; padding:4px 8px; border-radius:var(--radius-sm); }
            .edit-row .edit-delete-btn { height:34px; padding:0 10px; font-size:11px; border-radius:var(--radius-sm); }
            .edit-hint { font-size:10px; }
            .bottom-action-card { padding:8px 4px; min-height:62px; }
            .action-btn { min-height:46px; padding:4px 2px; gap:1px; }
            .action-btn .icon-wrap { width:24px; height:24px; font-size:12px; }
            .action-btn .label { font-size:9px; }
            .bottom-action-card.edit-mode .action-btn.edit-highlight { padding:6px 20px; }
            .add-modal .add-content, .backup-modal .backup-content { padding:24px 16px; }
            .add-modal .add-content .input-group input { font-size:14px; padding:10px 14px; }
            .add-modal .add-content .input-group input::placeholder { font-size:13px; }
            .add-modal .add-content .modal-actions button { font-size:14px; padding:10px 14px; }
            .backup-modal .backup-actions button, .backup-modal .backup-actions .file-input-wrap button { font-size:14px; padding:12px 14px; }
            .modal-close-btn { width:40px; height:40px; bottom:40px; font-size:16px; }
            .modal-close-btn svg { width:20px; height:20px; }
            .data-timestamp { font-size:9px; }
        }
        @media (max-width:360px) {
            .fund-name { font-size:12px; max-width:100px; }
            .fund-market-value { font-size:11px; }
            .metric-item .metric-value { font-size:10px; }
        }
    </style>
</head>
<body>
    <div class="app-container" id="app">
        <section class="summary-card" id="summaryCard">
            <div class="summary-today">
                <span class="today-label" id="todayLabel">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12" /></svg>
                    最新盈亏
                </span>
                <span class="today-value" id="todayProfitBig">+0.00</span>
            </div>
            <hr class="summary-divider">
            <div class="summary-stats">
                <div class="summary-stat-item"><div class="stat-label-wrap"><span class="stat-label">总资产</span></div><div class="stat-number neutral" id="totalAssets">0.00</div></div>
                <div class="summary-stat-item"><div class="stat-label-wrap"><span class="stat-label">持有收益</span></div><div class="stat-number neutral" id="totalProfit">+0.00</div></div>
                <div class="summary-stat-item"><div class="stat-label-wrap"><span class="stat-label">总收益率</span></div><div class="stat-number neutral" id="totalReturn">0.00%</div></div>
            </div>
            <div class="data-timestamp" id="dataTimestamp">净值日期：--</div>
        </section>

        <div class="fund-list" id="fundList"><div class="empty-state"><i class="fas fa-inbox"></i><p>还没有持仓基金</p><div class="sub">点击底部「添加持仓」</div></div></div>

        <div class="bottom-action-card" id="bottomActions">
            <div class="action-btn" id="openAddModalBtn"><div class="icon-wrap"><i class="fas fa-plus-circle"></i></div><span class="label">添加持仓</span></div>
            <div class="action-btn" id="batchEditBtn"><div class="icon-wrap"><i class="fas fa-pen"></i></div><span class="label">批量编辑</span></div>
            <div class="action-btn" id="openBackupModalBtn"><div class="icon-wrap"><i class="fas fa-database"></i></div><span class="label">数据管理</span></div>
            <div class="action-btn hide-in-edit" id="refreshBtn"><div class="icon-wrap"><i class="fas fa-sync-alt"></i></div><span class="label">刷新净值</span></div>
        </div>
    </div>

    <!-- 添加基金 -->
    <div class="modal-overlay add-modal" id="modalOverlay">
        <div class="add-content">
            <h2><i class="fas fa-coins"></i> 添加基金</h2>
            <div class="sub-placeholder"></div>
            <div class="input-group">
                <input type="text" id="fundCodeInput" maxlength="6" inputmode="decimal" placeholder="基金代码（6位）">
                <div class="auto-fill-info" id="autoFillInfo"><i class="fas fa-check-circle"></i> <span id="autoFillText">已识别：易方达蓝筹精选</span></div>
                <input type="number" id="fundCostInput" step="0.0001" inputmode="decimal" placeholder="成本价 (¥) 例如 1.1000">
                <input type="number" id="fundSharesInput" step="0.01" inputmode="decimal" placeholder="持有份额 例如 1500.00">
            </div>
            <div class="modal-actions"><button class="btn-cancel" id="closeModalBtn">取消</button><button class="btn-cancel" id="confirmAddBtn" disabled>确认添加</button></div>
            <button class="modal-close-btn" id="closeModalBtnCircle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></svg></button>
        </div>
    </div>

    <!-- 数据管理 -->
    <div class="modal-overlay backup-modal" id="backupModalOverlay">
        <div class="backup-content">
            <h2><i class="fas fa-database"></i> 数据管理</h2>
            <div class="sub-placeholder"></div>
            <div class="backup-actions">
                <button id="exportBtn"><i class="fas fa-download"></i> 导出配置</button>
                <div class="file-input-wrap"><button class="primary"><i class="fas fa-upload"></i> 导入配置</button><input type="file" id="importFileInput" accept=".json"></div>
                <button id="clearCacheBtn"><i class="fas fa-trash-alt"></i> 清除缓存</button>
                <button id="hardResetBtn" style="background:rgba(255,50,50,0.3);border:1px solid rgba(255,50,50,0.2);"><i class="fas fa-power-off"></i> 硬重置</button>
            </div>
            <button class="modal-close-btn" id="closeBackupModalBtnCircle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></svg></button>
        </div>
    </div>

    <!-- 提示 -->
    <div class="modal-overlay prompt-modal" id="promptModalOverlay">
        <div class="prompt-content"><h2 id="promptTitle">提示</h2><div class="prompt-message" id="promptMessage">消息内容</div><div class="modal-actions" id="promptActions"></div></div>
    </div>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <div class="check-pop" id="checkPop"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>

    <script>
        (function() {
            const STORAGE_H = 'fund_holdings';
            const STORAGE_C = 'fund_data_cache';
            let holdings = {};
            let fundDataCache = {};
            let editMode = false;
            let privacyMode = false;
            let isUpdating = false;
            const pendingRequests = new Set();

            function getToday() { return new Date().toISOString().slice(0, 10); }
            function isTradingDay(d) { d = d || new Date(); const day = d.getDay(); return day !== 0 && day !== 6; }
            function getNextTradingDay(date) {
                const d = new Date(date);
                d.setDate(d.getDate() + 1);
                while (!isTradingDay(d)) { d.setDate(d.getDate() + 1); }
                return d;
            }
            function isDataValid(dataDate) {
                if (!dataDate) return false;
                const now = new Date();
                const today = getToday();
                if (dataDate === today) return true;
                const nextTrading = getNextTradingDay(new Date(dataDate));
                const expireTime = new Date(nextTrading);
                expireTime.setHours(9, 0, 0, 0);
                return now < expireTime;
            }
            function isInDeepColorPeriod(navDateStr) {
                if (!navDateStr) return false;
                const navDate = new Date(navDateStr + 'T00:00:00');
                const now = new Date();
                const nextTradeDay = getNextTradingDay(navDate);
                const deadline = new Date(nextTradeDay);
                deadline.setHours(9, 0, 0, 0);
                return now >= navDate && now <= deadline;
            }
            function getValidName(name, code) {
                if (name && typeof name === 'string' && name.trim().length >= 2) return name.trim();
                return code;
            }

            function loadData() {
                try { holdings = JSON.parse(localStorage.getItem(STORAGE_H)) || {}; } catch (e) { holdings = {}; }
                try { fundDataCache = JSON.parse(localStorage.getItem(STORAGE_C)) || {}; } catch (e) { fundDataCache = {}; }
            }
            function saveAll() {
                try { localStorage.setItem(STORAGE_H, JSON.stringify(holdings)); localStorage.setItem(STORAGE_C, JSON.stringify(fundDataCache)); }
                catch (e) { showAlert('数据保存失败，请检查存储空间'); }
            }
            loadData();

            function fetchTencent(code) {
                return new Promise((resolve, reject) => {
                    const varName = 'v_jj' + code;
                    if (window[varName] && typeof window[varName] === 'string') {
                        const data = parseTencentData(window[varName]);
                        if (data) { resolve(data); return; }
                    }
                    const script = document.createElement('script');
                    script.src = 'https://qt.gtimg.cn/q=jj' + code;
                    script.async = true;
                    const tid = setTimeout(() => { cleanup(); reject(new Error('腾讯接口超时')); }, 8000);
                    function cleanup() {
                        clearTimeout(tid);
                        if (script.parentNode) script.parentNode.removeChild(script);
                    }
                    script.onload = function() {
                        clearTimeout(tid);
                        try {
                            const raw = window[varName];
                            if (raw && typeof raw === 'string') {
                                const data = parseTencentData(raw);
                                if (data) { cleanup(); resolve(data); return; }
                            }
                            cleanup(); reject(new Error('无法解析腾讯数据'));
                        } catch (e) { cleanup(); reject(e); }
                    };
                    script.onerror = function() { cleanup(); reject(new Error('腾讯接口请求失败')); };
                    document.head.appendChild(script);
                });
            }
            function parseTencentData(raw) {
                if (typeof raw !== 'string') return null;
                const parts = raw.split('~');
                if (parts.length < 9) return null;
                const nav = parseFloat(parts[5]) || 0;
                const rate = parseFloat(parts[7]) || 0;
                const date = parts[8] || '';
                if (nav <= 0 || !date) return null;
                return { fundcode: parts[0], name: parts[1], dwjz: nav, gszzl: rate, jzrq: date };
            }

            async function fetchFundDataOnly(code) {
                if (pendingRequests.has(code)) {
                    return new Promise((resolve) => {
                        const check = () => {
                            if (!pendingRequests.has(code)) {
                                const cache = fundDataCache[code];
                                if (cache && cache.nav && cache.date && isDataValid(cache.date))
                                    resolve({ nav: cache.nav, rate: cache.rate || 0, date: cache.date });
                                else resolve(null);
                            } else setTimeout(check, 200);
                        };
                        setTimeout(check, 100);
                    });
                }
                pendingRequests.add(code);
                try {
                    const qt = await fetchTencent(code);
                    if (qt && qt.dwjz > 0) {
                        const name = getValidName(qt.name, code);
                        fundDataCache[code] = { name, nav: qt.dwjz, rate: qt.gszzl, date: qt.jzrq, updateDate: getToday() };
                        saveAll();
                        return { nav: qt.dwjz, rate: qt.gszzl, date: qt.jzrq };
                    }
                } catch (e) { console.warn(`基金 ${code} 接口请求失败:`, e.message); }
                finally { pendingRequests.delete(code); }
                const cache = fundDataCache[code];
                if (cache && cache.nav && cache.date && isDataValid(cache.date))
                    return { nav: cache.nav, rate: cache.rate || 0, date: cache.date };
                return null;
            }

            function getDisplayData(code) {
                const cache = fundDataCache[code];
                if (cache && cache.nav && cache.date && isDataValid(cache.date))
                    return { nav: cache.nav, rate: cache.rate || 0, date: cache.date };
                return { nav: 0, rate: 0, date: '' };
            }

            async function batchUpdate(codes) {
                if (!codes.length) return;
                const batchSize = 5;
                for (let i = 0; i < codes.length; i += batchSize) {
                    const batch = codes.slice(i, i + batchSize);
                    await Promise.allSettled(batch.map(code => fetchFundDataOnly(code)));
                }
                renderAll();
            }

            function computeSummary() {
                const codes = Object.keys(holdings);
                if (!codes.length) return { totalAsset: 0, todayProfit: 0, totalProfit: 0, totalYield: 0 };
                let totalCost = 0, totalMV = 0, todayProfit = 0;
                codes.forEach(code => {
                    const h = holdings[code];
                    const cost = parseFloat(h.cost) || 0;
                    const shares = parseFloat(h.shares) || 0;
                    totalCost += cost * shares;
                    const display = getDisplayData(code);
                    const nav = display.nav || cost;
                    const rate = display.rate || 0;
                    const prev = rate !== 0 ? nav / (1 + rate / 100) : nav;
                    totalMV += nav * shares;
                    todayProfit += (nav - prev) * shares;
                });
                const totalProfit = totalMV - totalCost;
                const totalYield = totalCost > 0 ? (totalProfit / totalCost * 100) : 0;
                return { totalAsset: totalMV, todayProfit, totalProfit, totalYield };
            }

            function renderSummary() {
                if (privacyMode) return;
                const codes = Object.keys(holdings);
                const s = computeSummary();
                const todayEl = document.getElementById('todayProfitBig');
                const labelEl = document.getElementById('todayLabel');
                const tsEl = document.getElementById('dataTimestamp');
                if (!codes.length) {
                    todayEl.textContent = '+0.00'; todayEl.className = 'today-value neutral';
                    labelEl.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12" /></svg> 最新盈亏';
                    document.getElementById('totalAssets').textContent = '0.00'; document.getElementById('totalAssets').className = 'stat-number neutral';
                    document.getElementById('totalProfit').textContent = '+0.00'; document.getElementById('totalProfit').className = 'stat-number neutral';
                    document.getElementById('totalReturn').textContent = '0.00%'; document.getElementById('totalReturn').className = 'stat-number neutral';
                    tsEl.textContent = '净值日期：--'; return;
                }
                let latestDate = '', hasValid = false;
                codes.forEach(code => { const d = getDisplayData(code); if (d.date && d.nav > 0) { hasValid = true; if (d.date > latestDate) latestDate = d.date; } });
                const val = s.todayProfit;
                if (!hasValid) {
                    todayEl.textContent = '--'; todayEl.className = 'today-value neutral';
                    labelEl.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12" /></svg> 数据更新中...';
                    tsEl.textContent = '净值日期：--';
                } else {
                    todayEl.textContent = (val >= 0 ? '+' : '') + val.toFixed(2);
                    todayEl.className = 'today-value ' + (val > 0 ? 'positive' : val < 0 ? 'negative' : 'neutral');
                    labelEl.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12" /></svg> 最新盈亏';
                    tsEl.textContent = `净值日期：${latestDate}`;
                }
                function setStat(id, val, isPct) {
                    const el = document.getElementById(id);
                    if (isPct && val === 0) { el.textContent = '0.00%'; el.className = 'stat-number neutral'; return; }
                    const prefix = !isPct && val >= 0 ? '+' : '';
                    el.textContent = prefix + val.toFixed(2) + (isPct ? '%' : '');
                    el.className = 'stat-number ' + (val > 0 ? 'positive' : val < 0 ? 'negative' : 'neutral');
                }
                setStat('totalAssets', s.totalAsset, false);
                setStat('totalProfit', s.totalProfit, false);
                setStat('totalReturn', s.totalYield, true);
            }

            function renderFundList() {
                const container = document.getElementById('fundList');
                const codes = Object.keys(holdings);
                if (!codes.length) {
                    container.innerHTML = '<div class="empty-state"><i class="fas fa-inbox"></i><p>还没有持仓基金</p><div class="sub">点击底部「添加持仓」</div></div>';
                    if (editMode) { editMode = false; updateBottomBar(); }
                    return;
                }
                const sorted = codes.slice().sort((a, b) => {
                    const hA = holdings[a], hB = holdings[b];
                    const dA = getDisplayData(a), dB = getDisplayData(b);
                    const mvA = (dA.nav || parseFloat(hA.cost) || 0) * (parseFloat(hA.shares) || 0);
                    const mvB = (dB.nav || parseFloat(hB.cost) || 0) * (parseFloat(hB.shares) || 0);
                    return mvB - mvA;
                });
                const today = getToday();
                let html = '';
                sorted.forEach(code => {
                    const h = holdings[code];
                    const d = fundDataCache[code] || {};
                    const display = getDisplayData(code);
                    const cost = parseFloat(h.cost) || 0;
                    const shares = parseFloat(h.shares) || 0;
                    const currentNav = display.nav || cost;
                    const rate = display.rate || 0;
                    const prevNav = rate !== 0 ? currentNav / (1 + rate / 100) : currentNav;
                    const marketValue = currentNav * shares;
                    const todayProfit = (currentNav - prevNav) * shares;
                    const todayProfitRate = prevNav !== 0 ? (todayProfit / (prevNav * shares)) * 100 : 0;
                    const holdReturn = cost > 0 ? ((currentNav - cost) / cost) * 100 : 0;
                    const holdProfit = (currentNav - cost) * shares;
                    let name = getValidName(d.name, code);
                    if (!name || name === code) name = h.name || code;
                    const displayName = name.length > 14 ? name.slice(0, 14) + '…' : name;
                    let decorClass = 'decor-old';
                    if (display.date && display.nav > 0 && isInDeepColorPeriod(display.date)) {
                        decorClass = 'decor-today';
                    }
                    const metrics = [
                        { label: '最新收益率', value: todayProfitRate, pct: true },
                        { label: '最新盈亏', value: todayProfit, pct: false },
                        { label: '持有收益率', value: holdReturn, pct: true },
                        { label: '持有盈亏', value: holdProfit, pct: false }
                    ];
                    const metricHtml = metrics.map(m => {
                        const val = m.value;
                        const sign = val >= 0 ? '+' : '';
                        const displayVal = isNaN(val) ? '0.00' : sign + val.toFixed(2) + (m.pct ? '%' : '');
                        const cls = val > 0 ? 'positive' : val < 0 ? 'negative' : 'neutral';
                        return `<div class="metric-item"><span class="metric-label">${m.label}</span><span class="metric-value ${cls}">${displayVal}</span></div>`;
                    }).join('');
                    const editAreaClass = 'fund-edit-area' + (editMode ? ' active' : '');
                    const editHtml = `<div class="${editAreaClass}" data-code="${code}">
                        <div class="edit-row">
                            <input type="number" class="edit-input" id="editCost_${code}" value="${cost.toFixed(4)}" step="any" inputmode="decimal" placeholder="成本">
                            <input type="number" class="edit-input" id="editShares_${code}" value="${shares.toFixed(2)}" step="any" inputmode="decimal" placeholder="份额">
                            <button class="edit-delete-btn" data-code="${code}">删除</button>
                        </div>
                        <div class="edit-hint"><span class="current-cost">当前成本: ${cost.toFixed(4)}</span><span class="hint-tip">💡 修改后持有收益将重新计算</span></div>
                    </div>`;
                    html += `<div class="fund-card ${decorClass}${editMode ? ' edit-mode' : ''}" data-code="${code}">
                        <div class="fund-content">
                            <div class="fund-row fund-row-top">
                                <div class="fund-name-wrap"><span class="fund-name" title="${escapeHtml(name)}">${escapeHtml(displayName)}</span></div>
                                <div class="fund-code-wrap"><span class="fund-code-standalone">${code}</span></div>
                                <div class="fund-right-actions">
                                    <span class="fund-market-value">
                                        <i class="fas fa-coins coin-icon"></i> ¥${marketValue.toFixed(2)}
                                    </span>
                                </div>
                            </div>
                            <div class="fund-row-metrics">${metricHtml}</div>
                            ${editHtml}
                        </div>
                    </div>`;
                });
                container.innerHTML = html;
                if (editMode) {
                    container.querySelectorAll('.edit-delete-btn').forEach(btn => {
                        btn.addEventListener('click', function() { deleteFund(this.getAttribute('data-code')); });
                    });
                    const first = container.querySelector('.edit-input');
                    if (first) setTimeout(() => first.focus(), 100);
                }
            }

            function escapeHtml(str) { const div = document.createElement('div'); div.textContent = str; return div.innerHTML; }

            function renderAll() { renderSummary(); renderFundList(); updateBottomBar(); }

            function showCheck() {
                const el = document.getElementById('checkPop'); if (!el) return;
                el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
                setTimeout(() => el.classList.remove('show'), 600);
            }

            async function refreshData() {
                if (isUpdating) return;
                showCheck();
                isUpdating = true;
                const timeoutId = setTimeout(() => { if (isUpdating) { isUpdating = false; console.log('刷新超时，已解锁'); } }, 15000);
                try { const codes = Object.keys(holdings); if (codes.length) await batchUpdate(codes); renderAll(); }
                catch (e) { console.warn('刷新失败', e); showAlert('刷新失败，请检查网络后重试'); }
                finally { clearTimeout(timeoutId); isUpdating = false; }
            }

            function enterEditMode() { if (!Object.keys(holdings).length) { showAlert('暂无持仓'); return; } editMode = true; renderAll(); }
            function exitEditMode() {
                const codes = Object.keys(holdings);
                let changed = false;
                codes.forEach(code => {
                    const ci = document.getElementById('editCost_' + code);
                    const si = document.getElementById('editShares_' + code);
                    if (ci && si) {
                        const nc = parseFloat(ci.value), ns = parseFloat(si.value);
                        if (!isNaN(nc) && nc > 0 && !isNaN(ns) && ns > 0) {
                            if (holdings[code].cost !== nc || holdings[code].shares !== ns) { holdings[code].cost = nc; holdings[code].shares = ns; changed = true; }
                        }
                    }
                });
                if (changed) { saveAll(); refreshData(); }
                editMode = false; renderAll();
            }
            function deleteFund(code) {
                showConfirm('确定删除 ' + code + ' 吗？').then(ok => {
                    if (!ok) return;
                    delete holdings[code]; delete fundDataCache[code]; saveAll();
                    if (Object.keys(holdings).length === 0 && editMode) editMode = false;
                    renderAll();
                });
            }

            const promptOverlay = document.getElementById('promptModalOverlay');
            const promptTitle = document.getElementById('promptTitle');
            const promptMessage = document.getElementById('promptMessage');
            const promptActions = document.getElementById('promptActions');
            let promptResolve = null;

            function showPrompt(title, msg, btns) {
                if (promptResolve) { promptResolve(null); promptResolve = null; }
                return new Promise(resolve => {
                    promptResolve = resolve;
                    promptTitle.textContent = title || '提示';
                    promptMessage.textContent = msg || '';
                    promptActions.innerHTML = '';
                    btns.forEach(b => {
                        const el = document.createElement('button');
                        el.textContent = b.text;
                        el.className = b.cls || 'btn-confirm';
                        el.onclick = () => { promptOverlay.classList.remove('active'); const cb = promptResolve; promptResolve = null; if (cb) cb(b.value); };
                        promptActions.appendChild(el);
                    });
                    promptOverlay.classList.add('active');
                });
            }
            function showAlert(msg) { return showPrompt('提示', msg, [{ text: '确定', cls: 'btn-confirm', value: true }]); }
            function showConfirm(msg) { return showPrompt('确认', msg, [{ text: '取消', cls: 'btn-cancel', value: false }, { text: '确定', cls: 'btn-danger', value: true }]); }
            promptOverlay.addEventListener('click', function(e) { if (e.target === promptOverlay && promptResolve) { promptOverlay.classList.remove('active'); const cb = promptResolve; promptResolve = null; if (cb) cb(null); } });

            function setupModal() {
                const overlay = document.getElementById('modalOverlay');
                const closeBtn = document.getElementById('closeModalBtn');
                const confirmBtn = document.getElementById('confirmAddBtn');
                const openBtn = document.getElementById('openAddModalBtn');
                const codeInput = document.getElementById('fundCodeInput');
                const costInput = document.getElementById('fundCostInput');
                const sharesInput = document.getElementById('fundSharesInput');
                const closeCircle = document.getElementById('closeModalBtnCircle');
                const infoBox = document.getElementById('autoFillInfo');
                const infoText = document.getElementById('autoFillText');
                let fetchName = '';
                let identifyTimer = null;

                function openAddHandler() {
                    if (editMode) return;
                    const icon = openBtn.querySelector('.icon-wrap');
                    if (icon) { icon.classList.remove('pop'); void icon.offsetWidth; icon.classList.add('pop'); }
                    confirmBtn.disabled = true; codeInput.value = ''; costInput.value = ''; sharesInput.value = ''; infoBox.classList.remove('show'); fetchName = '';
                    overlay.classList.add('active'); setTimeout(() => codeInput.focus(), 300);
                }
                openBtn.addEventListener('click', openAddHandler);

                function closeModal() { overlay.classList.remove('active'); fetchName = ''; }
                closeBtn.onclick = closeModal; closeCircle.onclick = closeModal;
                overlay.addEventListener('click', function(e) { if (e.target === overlay) closeModal(); });

                codeInput.addEventListener('input', function() {
                    const code = this.value.trim();
                    clearTimeout(identifyTimer);
                    if (code.length === 6 && /^\d{6}$/.test(code)) {
                        identifyTimer = setTimeout(() => {
                            fetchTencent(code).then(data => {
                                if (data && data.name) { fetchName = data.name; infoText.textContent = '已识别：' + data.name; infoBox.classList.add('show'); confirmBtn.disabled = false; }
                                else { infoBox.classList.remove('show'); confirmBtn.disabled = true; fetchName = ''; }
                            }).catch(() => { infoBox.classList.remove('show'); confirmBtn.disabled = true; fetchName = ''; });
                        }, 400);
                    } else { infoBox.classList.remove('show'); confirmBtn.disabled = true; fetchName = ''; }
                });

                confirmBtn.addEventListener('click', async function() {
                    if (this.disabled) return;
                    this.disabled = true;
                    try {
                        const code = codeInput.value.trim();
                        const cost = parseFloat(costInput.value);
                        const shares = parseFloat(sharesInput.value);
                        if (code.length !== 6 || !/^\d{6}$/.test(code)) { await showAlert('请输入6位数字代码'); return; }
                        if (isNaN(cost) || cost <= 0) { await showAlert('请输入有效成本价'); return; }
                        if (isNaN(shares) || shares <= 0) { await showAlert('请输入有效份额'); return; }
                        let name = fetchName;
                        if (!name) { try { const d = await fetchTencent(code); if (d && d.name) name = d.name; } catch (e) {} }
                        if (!name) { await showAlert('未能识别基金代码，请检查网络后重试'); return; }
                        if (holdings[code]) { const overwrite = await showConfirm('已存在 ' + name + '，是否覆盖？'); if (!overwrite) return; }
                        holdings[code] = { cost, shares, name }; saveAll();
                        closeModal();
                        await fetchFundDataOnly(code);
                        renderAll();
                    } catch (err) {
                        console.error('添加失败:', err);
                        await showAlert('添加失败，请重试');
                    } finally { this.disabled = false; }
                });
            }

            function setupBackup() {
                const overlay = document.getElementById('backupModalOverlay');
                const openBtn = document.getElementById('openBackupModalBtn');
                const exportBtn = document.getElementById('exportBtn');
                const importInput = document.getElementById('importFileInput');
                const clearCacheBtn = document.getElementById('clearCacheBtn');
                const hardResetBtn = document.getElementById('hardResetBtn');
                const closeCircle = document.getElementById('closeBackupModalBtnCircle');

                function openBackupHandler() {
                    if (editMode) { showAlert('请先完成编辑'); return; }
                    const icon = openBtn.querySelector('.icon-wrap');
                    if (icon) { icon.classList.remove('pop'); void icon.offsetWidth; icon.classList.add('pop'); }
                    overlay.classList.add('active');
                }
                openBtn.addEventListener('click', openBackupHandler);

                function closeModal() { overlay.classList.remove('active'); }
                closeCircle.onclick = closeModal;
                overlay.addEventListener('click', function(e) { if (e.target === overlay) closeModal(); });

                exportBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const data = JSON.stringify({ holdings, fundDataCache }, null, 2);
                    const blob = new Blob([data], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a'); a.href = url; a.download = 'iFunds_backup_' + new Date().toISOString().slice(0, 10) + '.json';
                    document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
                });
                importInput.addEventListener('change', async function(e) {
                    e.stopPropagation();
                    const file = this.files[0]; if (!file) return;
                    const reader = new FileReader();
                    reader.onload = async function(ev) {
                        try {
                            const data = JSON.parse(ev.target.result);
                            if (data.holdings && typeof data.holdings === 'object') {
                                const count = Object.keys(data.holdings).length;
                                const ok = await showConfirm('将导入 ' + count + ' 只基金，覆盖当前数据？');
                                if (ok) { holdings = data.holdings || {}; fundDataCache = data.fundDataCache || {}; saveAll(); closeModal(); await refreshData(); }
                            } else await showAlert('配置格式无效，缺少持仓数据');
                        } catch (_) { await showAlert('文件解析失败，请确认是有效的JSON文件'); }
                    };
                    reader.readAsText(file); this.value = '';
                });
                clearCacheBtn.addEventListener('click', async function(e) { e.stopPropagation(); const ok = await showConfirm('清除所有缓存数据？（持仓配置保留）'); if (ok) { fundDataCache = {}; saveAll(); closeModal(); await refreshData(); await showAlert('缓存已清除'); } });
                hardResetBtn.addEventListener('click', async function(e) { e.stopPropagation(); const ok = await showConfirm('⚠️ 硬重置将清除所有数据并重新加载页面，确定吗？'); if (ok) { localStorage.clear(); location.reload(true); } });
            }

            function updateBottomBar() {
                const bar = document.getElementById('bottomActions');
                const addBtn = document.getElementById('openAddModalBtn');
                const batchBtn = document.getElementById('batchEditBtn');
                const dataBtn = document.getElementById('openBackupModalBtn');
                const refreshBtn = document.getElementById('refreshBtn');
                if (editMode) {
                    bar.classList.add('edit-mode');
                    addBtn.style.display = 'none'; dataBtn.style.display = 'none'; refreshBtn.style.display = 'none';
                    batchBtn.innerHTML = '<div class="icon-wrap"><i class="fas fa-check"></i></div><span class="label">完成编辑</span>';
                    batchBtn.className = 'action-btn edit-highlight'; batchBtn.style.display = 'flex';
                    batchBtn.onclick = () => exitEditMode();
                } else {
                    bar.classList.remove('edit-mode');
                    addBtn.style.display = 'flex'; dataBtn.style.display = 'flex'; refreshBtn.style.display = 'flex'; batchBtn.style.display = 'flex';
                    addBtn.innerHTML = '<div class="icon-wrap"><i class="fas fa-plus-circle"></i></div><span class="label">添加持仓</span>'; addBtn.className = 'action-btn';
                    batchBtn.innerHTML = '<div class="icon-wrap"><i class="fas fa-pen"></i></div><span class="label">批量编辑</span>'; batchBtn.className = 'action-btn';
                    batchBtn.onclick = () => enterEditMode();
                    dataBtn.innerHTML = '<div class="icon-wrap"><i class="fas fa-database"></i></div><span class="label">数据管理</span>'; dataBtn.className = 'action-btn';
                    refreshBtn.onclick = function() { const icon = this.querySelector('.icon-wrap'); if (icon) { icon.classList.remove('pop'); void icon.offsetWidth; icon.classList.add('pop'); } refreshData(); };
                }
            }

            let clickCount = 0, clickTimer = null;
            function setupPrivacy() {
                document.getElementById('summaryCard').addEventListener('click', function(e) {
                    if (e.target.closest('button')) return;
                    clearTimeout(clickTimer);
                    clickCount++;
                    clickTimer = setTimeout(() => {
                        if (clickCount >= 3) {
                            privacyMode = !privacyMode;
                            const els = ['todayProfitBig', 'totalAssets', 'totalProfit', 'totalReturn'];
                            els.forEach(id => { const el = document.getElementById(id); if (privacyMode) { el.classList.add('privacy'); el.textContent = '***'; } else el.classList.remove('privacy'); });
                            if (!privacyMode) renderAll();
                            clickCount = 0;
                        }
                    }, 400);
                });
            }

            function registerSW() {
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.register('./sw.js').then(reg => console.log('SW 注册成功', reg.scope)).catch(err => console.warn('SW 注册失败:', err.message));
                }
            }

            function init() {
                loadData();
                setupPrivacy();
                renderAll();
                if (Object.keys(holdings).length) refreshData();
                setupModal();
                setupBackup();
                registerSW();
                console.log('✅ iFunds 最终优化版');
            }
            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
            else init();
            window.deleteFund = deleteFund;
        })();
    </script>
</body>
</html>
