<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>iFunds</title>
    <link rel="manifest" href="./manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="iFunds" />
    <link rel="apple-touch-icon" href="./icon-1024.png" />
    <meta name="theme-color" content="#0b1a33" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js">
    </script>
    <style>
        :root {
            --radius-top: 22px;
            --radius-md: 20px;
            --radius-bottom: 18px;
            --radius-sm: 12px;
            --radius-xs: 6px;
            --radius-full: 50%;
            --color-bg: #f2f5fc;
            --color-card-bg: #ffffff;
            --color-primary: #0b1a33;
            --color-primary-light: #132b4a;
            --color-text: #0b1a33;
            --color-text-secondary: #6b7d98;
            --color-text-light: #94a3b8;
            --color-border: #e2e8f0;
            --color-positive: #D96060;
            --color-negative: #3AAD9F;
            --color-neutral: #94a3b8;
            --color-edit-border: #d0d8e0;
            --color-edit-bg: #f8fafc;
            --shadow-card: 0 4px 16px rgba(0, 0, 0, 0.08);
            --shadow-summary: 0 6px 24px rgba(0, 0, 0, 0.12);
            --decor-today: #0b1a33;
            --decor-old: #b8c8d8;
            --chart-grid: #eef2f8;
            --chart-text: #6b7d98;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        html,
        body {
            width: 100%;
            min-height: 100vh;
            background: var(--color-bg);
            display: flex;
            justify-content: center;
            padding: 4px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        body::-webkit-scrollbar {
            display: none;
        }

        .app-container {
            max-width: 480px;
            width: 100%;
            background: #ffffff;
            border-radius: var(--radius-md);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
            padding: 14px 14px 10px 14px;
            display: flex;
            flex-direction: column;
            align-self: flex-start;
            gap: 16px;
            transition: transform 0.3s ease;
        }

        #pullIndicator {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 6px 0 2px;
            font-size: 12px;
            color: var(--color-text-light);
            opacity: 0;
            height: 0;
            overflow: hidden;
            transition: opacity 0.2s ease, height 0.2s ease;
        }
        #pullIndicator.show {
            display: flex;
            opacity: 1;
            height: 36px;
        }
        #pullIndicator .arrow {
            display: inline-block;
            font-size: 16px;
            transition: transform 0.3s ease;
        }
        #pullIndicator .arrow.flip {
            transform: rotate(180deg);
        }
        #pullIndicator .status-text {
            font-weight: 500;
            font-size: 12px;
        }
        #pullIndicator .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid var(--color-border);
            border-top-color: var(--color-primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        #pullIndicator .spinner.active {
            display: inline-block;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .summary-card {
            background: linear-gradient(145deg, var(--color-primary), var(--color-primary-light));
            border-radius: var(--radius-top);
            padding: 10px 14px 8px 14px;
            color: white;
            flex-shrink: 0;
            box-shadow: var(--shadow-summary);
        }
        .summary-today {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 6px;
        }
        .summary-today .today-label {
            font-size: 13px;
            font-weight: 500;
            opacity: 0.7;
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .summary-today .today-label svg {
            width: 16px;
            height: 16px;
            stroke: rgba(255, 255, 255, 0.7);
            stroke-width: 2;
            fill: none;
        }
        .summary-today .today-value {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
            line-height: 1.2;
            margin-top: 0px;
        }
        .summary-today .today-value.positive { color: var(--color-positive); }
        .summary-today .today-value.negative { color: var(--color-negative); }
        .summary-today .today-value.neutral { color: var(--color-text-light); }
        .summary-today .today-value.privacy { color: var(--color-text-light); letter-spacing: 4px; }
        .summary-divider {
            border: none;
            border-top: 1px solid rgba(255, 255, 255, 0.10);
            margin: 0 0 6px 0;
        }
        .summary-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .summary-stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            position: relative;
            gap: 2px;
        }
        .summary-stat-item:not(:last-child)::after {
            content: '';
            position: absolute;
            right: 0;
            top: 15%;
            height: 70%;
            width: 1px;
            background: rgba(255, 255, 255, 0.12);
        }
        .summary-stat-item .stat-label-wrap {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .summary-stat-item .stat-label {
            font-size: 10px;
            opacity: 0.5;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        .summary-stat-item .stat-number {
            font-size: 14px;
            font-weight: 600;
            line-height: 1.3;
        }
        .summary-stat-item .stat-number.privacy {
            letter-spacing: 3px;
            color: var(--color-text-light) !important;
        }
        .stat-number.positive { color: var(--color-positive); }
        .stat-number.negative { color: var(--color-negative); }
        .stat-number.neutral { color: var(--color-text-light); }
        .data-timestamp {
            font-size: 10px;
            opacity: 0.5;
            text-align: center;
            margin-top: 4px;
            letter-spacing: 0.3px;
        }

        .fund-list {
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex: 1;
        }

        .fund-card {
            background: var(--color-card-bg);
            border-radius: var(--radius-md);
            padding: 10px 14px 12px 14px;
            border: 1px solid var(--color-border);
            box-shadow: var(--shadow-card);
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-shrink: 0;
            transition: box-shadow 0.2s, border-color 0.3s;
            position: relative;
            overflow: hidden;
        }
        .fund-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            border-radius: 0;
            transition: background 0.4s ease;
        }
        .fund-card.decor-today::before { background: var(--decor-today); }
        .fund-card.decor-old::before { background: var(--decor-old); }
        .fund-card.flash-update { animation: flashCard 0.6s ease; }
        @keyframes flashCard {
            0% { background: #f0f7ff; }
            50% { background: #e0edf9; }
            100% { background: var(--color-card-bg); }
        }

        .fund-row-top {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            align-items: center;
            height: 30px;
            padding-left: 10px;
            column-gap: 0;
        }
        .fund-name-wrap {
            grid-column: 1 / 3;
            min-width: 0;
            overflow: hidden;
            padding-right: 4px;
        }
        .fund-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--color-text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
        }
        .fund-code-wrap { grid-column: 3; display: flex; justify-content: center; align-items: center; }
        .fund-code-standalone {
            display: inline-block;
            font-weight: 400;
            font-size: 10px;
            color: var(--color-text-secondary);
            background: #f0f4fc;
            padding: 0 8px;
            border-radius: var(--radius-md);
            line-height: 18px;
            text-align: center;
        }
        .fund-right-actions { grid-column: 4; display: flex; align-items: center; justify-content: flex-end; white-space: nowrap; }
        .fund-market-value { font-size: 14px; font-weight: 600; color: var(--color-text); display: flex; align-items: center; gap: 3px; }
        .coin-icon { font-size: 12px; color: var(--color-text-secondary); opacity: 0.7; }

        .fund-row-metrics {
            display: flex;
            align-items: stretch;
            padding-left: 10px;
            height: 40px;
            position: relative;
        }
        .edit-mode .fund-row-metrics { display: none; }
        .metric-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2px 0;
            position: relative;
            min-width: 0;
        }
        .metric-item:not(:last-child)::after {
            content: '';
            position: absolute;
            right: 0;
            top: 10%;
            height: 80%;
            width: 1px;
            background: #e0e5ed;
        }
        .metric-item .metric-label { font-size: 10px; font-weight: 500; color: var(--color-text-light); letter-spacing: 0.2px; line-height: 1.2; }
        .metric-item .metric-value { font-size: 12px; font-weight: 600; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .metric-item .metric-value.positive { color: var(--color-positive); }
        .metric-item .metric-value.negative { color: var(--color-negative); }
        .metric-item .metric-value.neutral { color: var(--color-text-light); }

        .fund-edit-area {
            display: none;
            padding: 8px 0 2px 10px;
            border-top: 1px dashed var(--color-border);
            flex-direction: column;
            gap: 6px;
        }
        .fund-edit-area.active { display: flex; }
        .edit-row { display: flex; gap: 6px; align-items: center; width: 100%; flex-wrap: nowrap; }
        .edit-row .edit-input {
            flex: 1;
            min-width: 0;
            height: 36px;
            padding: 4px 8px;
            font-size: 12px;
            font-family: inherit;
            border-radius: var(--radius-sm);
            border: 1px solid var(--color-edit-border);
            background: var(--color-edit-bg);
            color: var(--color-text);
            outline: none;
            transition: border 0.2s ease;
            -webkit-appearance: none;
            text-align: center;
        }
        .edit-row .edit-input:focus {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 2px rgba(11, 26, 51, 0.08);
        }
        .edit-row .edit-input::placeholder { color: var(--color-text-light); opacity: 0.6; text-align: center; }
        .edit-row .edit-delete-btn {
            flex: 0 0 60px;
            height: 36px;
            padding: 0 12px;
            font-size: 11px;
            font-weight: 600;
            font-family: inherit;
            border: none;
            border-radius: var(--radius-sm);
            background: var(--color-positive);
            color: #fff;
            cursor: pointer;
            transition: opacity 0.2s ease;
            white-space: nowrap;
        }
        .edit-row .edit-delete-btn:active { opacity: 0.6; transform: scale(0.96); }
        .edit-hint { font-size: 10px; color: var(--color-text-light); display: flex; justify-content: space-between; align-items: center; padding: 0 2px; }
        .edit-hint .current-cost { font-weight: 500; color: var(--color-text-secondary); }

        .empty-state { text-align: center; padding: 40px 20px; color: var(--color-text-secondary); }
        .empty-state i { font-size: 36px; color: #d5dde8; margin-bottom: 6px; }
        .empty-state p { font-size: 14px; font-weight: 500; }
        .empty-state .sub { font-size: 12px; opacity: 0.6; margin-top: 2px; }

        .card-block {
            background: var(--color-card-bg);
            border-radius: var(--radius-md);
            padding: 14px;
            border: 1px solid var(--color-border);
            box-shadow: var(--shadow-card);
            transition: opacity 0.3s ease, max-height 0.3s ease, padding 0.3s ease, margin 0.3s ease;
            overflow: hidden;
        }
        .card-block.edit-hidden { opacity: 0; max-height: 0; padding: 0 14px; border: none; margin: 0; pointer-events: none; }
        .chart-container { height: 170px; position: relative; }
        .chart-container canvas { width: 100% !important; height: 100% !important; }
        .chart-empty { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--color-text-secondary); font-size: 14px; font-weight: 500; }
        .analysis-empty { font-size: 13px; color: var(--color-text-light); text-align: center; padding: 30px 0; font-weight: 500; }

        .pie-chart-container {
            height: 200px;
            position: relative;
            width: 100%;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .legend-side { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
        .legend-item { display: flex; align-items: center; gap: 5px; font-size: 10px; font-weight: 500; color: #334155; white-space: nowrap; }
        .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
        .chart-canvas-wrap { flex: 1; height: 100%; position: relative; }
        .chart-canvas-wrap canvas { width: 100% !important; height: 100% !important; }

        .bottom-action-card {
            background: linear-gradient(145deg, var(--color-primary), var(--color-primary-light));
            border-radius: var(--radius-bottom);
            padding: 10px 6px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
            display: flex;
            align-items: stretch;
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
            margin-top: 1px;
            transition: all 0.3s ease;
            justify-content: center;
            min-height: 72px;
        }
        .bottom-action-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 30% 20%, rgba(255, 255, 255, 0.08) 0%, transparent 60%);
            pointer-events: none;
        }
        .action-btn {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            padding: 6px 4px;
            cursor: pointer;
            transition: background 0.2s ease;
            border: none;
            background: transparent;
            color: #ffffff;
            position: relative;
            border-radius: var(--radius-md);
            min-height: 52px;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            user-select: none;
        }
        .action-btn:not(:last-child)::after {
            content: '';
            position: absolute;
            right: 0;
            top: 15%;
            height: 70%;
            width: 1px;
            background: rgba(255, 255, 255, 0.12);
        }
        .action-btn:active { background: rgba(255, 255, 255, 0.06); transform: scale(0.96); }
        .action-btn .icon-wrap {
            width: 28px;
            height: 28px;
            border-radius: var(--radius-full);
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #ffffff;
            flex-shrink: 0;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: background 0.2s;
            will-change: transform;
            pointer-events: none;
        }
        @keyframes iconPop { 0% { transform: scale(1); } 35% { transform: scale(1.3); } 60% { transform: scale(0.92); } 100% { transform: scale(1); } }
        .action-btn .icon-wrap.pop { animation: iconPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .action-btn .label { font-size: 10px; font-weight: 500; color: rgba(255, 255, 255, 0.75); letter-spacing: 0.2px; white-space: nowrap; pointer-events: none; }
        .bottom-action-card.edit-mode .action-btn { display: none !important; }
        .bottom-action-card.edit-mode .action-btn.edit-highlight { display: flex !important; flex: 0 0 auto; padding: 8px 28px; background: transparent !important; border-radius: var(--radius-md); }
        .bottom-action-card.edit-mode .action-btn.edit-highlight .icon-wrap { background: rgba(255, 255, 255, 0.12); border-color: rgba(255, 255, 255, 0.08); }
        .bottom-action-card.edit-mode .action-btn.edit-highlight .label { color: rgba(255, 255, 255, 0.75); }
        .bottom-action-card.edit-mode .action-btn::after { display: none !important; }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            justify-content: center;
            align-items: center;
            z-index: 999;
            padding: 0;
            box-sizing: border-box;
        }
        .modal-overlay.active { display: flex; }
        .add-modal .add-content,
        .backup-modal .backup-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 32px 24px;
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 100%;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 0;
            border: none;
            box-shadow: none;
            position: relative;
        }
        .add-modal .add-content h2,
        .backup-modal .backup-content h2 { font-size: 22px; font-weight: 700; color: #0b1a33; display: flex; align-items: center; gap: 8px; margin-bottom: 0px; }
        .add-modal .add-content h2 i,
        .backup-modal .backup-content h2 i { color: #0b1a33; }
        .sub-placeholder { height: 24px; flex-shrink: 0; }
        .add-modal .add-content .input-group { width: 100%; display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }
        .add-modal .add-content .input-group input {
            width: 100%;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(4px);
            font-size: 15px;
            color: #ffffff;
            outline: none;
            transition: 0.15s;
            -webkit-appearance: none;
        }
        .add-modal .add-content .input-group input::placeholder { color: rgba(255, 255, 255, 0.4); font-weight: 400; font-size: 14px; }
        .add-modal .add-content .input-group input:focus { border-color: rgba(255, 255, 255, 0.5); background: rgba(255, 255, 255, 0.2); }
        .add-modal .add-content .auto-fill-info { width: 100%; background: rgba(255, 255, 255, 0.1); border-radius: var(--radius-md); padding: 8px 14px; font-size: 13px; color: rgba(255, 255, 255, 0.85); border: 1px solid rgba(255, 255, 255, 0.1); display: none; margin-top: -6px; margin-bottom: 2px; text-align: center; }
        .add-modal .add-content .auto-fill-info.show { display: block; }
        .add-modal .add-content .modal-actions { display: flex; gap: 12px; width: 100%; justify-content: center; margin-top: 12px; }
        .add-modal .add-content .modal-actions button {
            flex: 1;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            font-size: 15px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            transition: 0.15s;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            color: #ffffff;
        }
        .add-modal .add-content .modal-actions button:active { background: rgba(255, 255, 255, 0.25); transform: scale(0.96); }
        .add-modal .add-content .modal-actions .btn-cancel { background: rgba(255, 255, 255, 0.15); color: #ffffff; border: 1px solid rgba(255, 255, 255, 0.1); }
        .add-modal .add-content .modal-actions .btn-confirm:disabled { opacity: 0.4; cursor: not-allowed; }
        .backup-modal .backup-actions { display: flex; flex-direction: column; gap: 10px; width: 100%; }
        .backup-modal .backup-actions button,
        .backup-modal .backup-actions .file-input-wrap {
            width: 100%;
            border-radius: var(--radius-md);
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-align: center;
            line-height: 1.3;
            transition: 0.15s;
            cursor: pointer;
            padding: 14px 16px;
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
        }
        .backup-modal .backup-actions .file-input-wrap { padding: 0; position: relative; overflow: hidden; }
        .backup-modal .backup-actions .file-input-wrap button { width: 100%; height: 100%; padding: 14px 16px; font-size: 16px; font-weight: 600; color: #ffffff; background: transparent; border: none; backdrop-filter: none; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; }
        .backup-modal .backup-actions .file-input-wrap input[type="file"] { position: absolute; left: 0; top: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
        .backup-modal .backup-actions button:active,
        .backup-modal .backup-actions .file-input-wrap:active { background: rgba(255, 255, 255, 0.25); transform: scale(0.96); }
        .modal-close-btn { position: absolute; bottom: 48px; left: 50%; transform: translateX(-50%); width: 48px; height: 48px; border-radius: var(--radius-full); background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.2); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; color: rgba(255, 255, 255, 0.7); font-size: 18px; z-index: 10; }
        .modal-close-btn:active { transform: translateX(-50%) scale(0.88); background: rgba(255, 255, 255, 0.25); }
        .modal-close-btn svg { width: 24px; height: 24px; stroke: rgba(255, 255, 255, 0.7); stroke-width: 2; fill: none; }

    <script>
        (function() {
            'use strict';

            const STORAGE_H = 'fund_holdings';
            const STORAGE_C = 'fund_data_cache';
            const STORAGE_A = 'account_profit_history';
            const STORAGE_T = 'fund_industry_tags';

            const DEEP_OCEAN = ['#1A3A4A', '#2A5F6F', '#3D7A8C', '#5A9AAA', '#7AB8C8', '#A8D0D8'];

            let holdings = {};
            let fundDataCache = {};
            let accountProfitHistory = [];
            let industryTags = {};
            let editMode = false;
            let privacyMode = false;
            let isUpdating = false;
            let profitChart = null;
            let pieChart = null;

            function getToday() { return new Date().toISOString().slice(0, 10); }
            function formatMoney(v) { if (v === undefined || v === null || isNaN(v)) return '--'; return (v >= 0 ? '+' : '') + v.toFixed(2); }
            function round4(v) { return Math.round(v * 10000) / 10000; }
            function escapeHTML(str) { if (!str) return ''; const div = document.createElement('div'); div.textContent = str; return div.innerHTML; }
            function isTradingDay(d) { const day = d.getDay(); return day !== 0 && day !== 6; }
            function getValidName(name, code) { if (name && typeof name === 'string' && name.trim().length >= 2) return name.trim(); return code; }

            function loadData() {
                try { holdings = JSON.parse(localStorage.getItem(STORAGE_H)) || {}; } catch (e) { holdings = {}; }
                try { fundDataCache = JSON.parse(localStorage.getItem(STORAGE_C)) || {}; } catch (e) { fundDataCache = {}; }
                try { accountProfitHistory = JSON.parse(localStorage.getItem(STORAGE_A)) || []; } catch (e) { accountProfitHistory = []; }
                try { industryTags = JSON.parse(localStorage.getItem(STORAGE_T)) || {}; } catch (e) { industryTags = {}; }
            }
            function saveAll() {
                localStorage.setItem(STORAGE_H, JSON.stringify(holdings));
                localStorage.setItem(STORAGE_C, JSON.stringify(fundDataCache));
                localStorage.setItem(STORAGE_A, JSON.stringify(accountProfitHistory));
                localStorage.setItem(STORAGE_T, JSON.stringify(industryTags));
            }
            function hardReset() {
                const keys = Object.keys(localStorage);
                keys.forEach(key => { if (key.startsWith('fund_')) localStorage.removeItem(key); });
                loadData(); renderAll();
            }

            function fetchTxFund(code) {
                return new Promise((resolve, reject) => {
                    const varName = 'v_jj' + code;
                    if (window[varName] && typeof window[varName] === 'string') { const data = parseTxData(window[varName]); if (data) { resolve(data); return; } }
                    const script = document.createElement('script');
                    script.src = 'https://qt.gtimg.cn/q=jj' + code;
                    script.async = true;
                    const tid = setTimeout(() => { cleanup(); reject(new Error('腾讯接口超时')); }, 8000);
                    function cleanup() { clearTimeout(tid); if (script.parentNode) script.parentNode.removeChild(script); }
                    script.onload = function() {
                        clearTimeout(tid);
                        try {
                            const raw = window[varName];
                            if (raw && typeof raw === 'string') { const data = parseTxData(raw); if (data) { cleanup(); resolve(data); return; } }
                            cleanup(); reject(new Error('无法解析腾讯数据'));
                        } catch (e) { cleanup(); reject(e); }
                    };
                    script.onerror = function() { cleanup(); reject(new Error('腾讯接口请求失败')); };
                    document.head.appendChild(script);
                });
            }
            function parseTxData(raw) {
                if (typeof raw !== 'string') return null;
                const parts = raw.split('~'); if (parts.length < 9) return null;
                const nav = parseFloat(parts[5]) || 0; const rate = parseFloat(parts[7]) || 0; const date = parts[8] || '';
                if (nav <= 0 || !date) return null;
                return { fundcode: parts[0], name: parts[1], dwjz: nav, gszzl: rate, jzrq: date };
            }

            async function fetchFundDataOnlyForce(code) {
                try {
                    const tx = await fetchTxFund(code);
                    if (tx && tx.dwjz > 0) { fundDataCache[code] = { name: getValidName(tx.name, code), nav: tx.dwjz, rate: tx.gszzl, date: tx.jzrq, updateDate: getToday() }; saveAll(); return true; }
                } catch (e) { console.warn('强制刷新失败', code, e.message); }
                return false;
            }
            async function fetchFundDataOnly(code) {
                try {
                    const tx = await fetchTxFund(code);
                    if (tx && tx.dwjz > 0) { fundDataCache[code] = { name: getValidName(tx.name, code), nav: tx.dwjz, rate: tx.gszzl, date: tx.jzrq, updateDate: getToday() }; saveAll(); return true; }
                } catch (e) { console.warn('fetch error', code, e.message); }
                return false;
            }
            function getDisplayData(code) { const cache = fundDataCache[code] || {}; if (cache.nav && cache.date) return { nav: cache.nav, rate: cache.rate || 0, date: cache.date }; return { nav: 0, rate: 0, date: '' }; }
            function getCardData(code) {
                const h = holdings[code]; if (!h) return null;
                const cost = parseFloat(h.cost) || 0; const shares = parseFloat(h.shares) || 0;
                const display = getDisplayData(code); const nav = display.nav || cost; const rate = display.rate || 0;
                const prev = rate !== 0 ? nav / (1 + rate / 100) : nav;
                const marketValue = nav * shares; const dayProfit = (nav - prev) * shares; const dayRate = rate;
                const holdProfit = (nav - cost) * shares; const holdYield = cost > 0 ? ((nav - cost) / cost * 100) : 0;
                return { name: h.name || code, code, marketValue, dayRate, dayProfit, holdProfit, holdYield, cost, shares };
            }
            function computeSummary() {
                const codes = Object.keys(holdings);
                if (!codes.length) return { totalAsset: 0, todayProfit: 0, totalProfit: 0, totalYield: 0 };
                let totalCost = 0, totalMV = 0, totalPrev = 0;
                codes.forEach(code => {
                    const h = holdings[code]; const cost = parseFloat(h.cost) || 0; const shares = parseFloat(h.shares) || 0;
                    totalCost += cost * shares; const display = getDisplayData(code); const nav = display.nav || cost; const rate = display.rate || 0;
                    const prev = rate !== 0 ? nav / (1 + rate / 100) : nav; totalMV += nav * shares; totalPrev += prev * shares;
                });
                return { totalAsset: round4(totalMV), todayProfit: round4(totalMV - totalPrev), totalProfit: round4(totalMV - totalCost), totalYield: totalCost > 0 ? round4((totalMV - totalCost) / totalCost * 100) : 0 };
            }
            function getTodayProfit() { return computeSummary().todayProfit; }

            function saveTodaySnapshot() {
                const today = getToday(); const codes = Object.keys(holdings);
                let hasTodayData = false;
                for (let code of codes) { const d = getDisplayData(code); if (d.date === today && d.nav > 0) { hasTodayData = true; break; } }
                if (!hasTodayData) return;
                const profit = getTodayProfit(); const existing = accountProfitHistory.findIndex(item => item.date === today);
                if (existing >= 0) accountProfitHistory[existing].profit = round4(profit);
                else accountProfitHistory.push({ date: today, profit: round4(profit) });
                accountProfitHistory.sort((a, b) => a.date.localeCompare(b.date));
                if (accountProfitHistory.length > 30) accountProfitHistory = accountProfitHistory.slice(-30);
                saveAll();
            }

            function backfillProfitHistory() {
                const codes = Object.keys(holdings); if (!codes.length) return;
                let hasValidData = false; codes.forEach(code => { const d = getDisplayData(code); if (d.nav > 0 && d.date) hasValidData = true; });
                if (!hasValidData) return;
                const existingDates = new Set(accountProfitHistory.map(i => i.date));
                let lastDate = null; if (accountProfitHistory.length > 0) { const sorted = accountProfitHistory.slice().sort((a, b) => a.date.localeCompare(b.date)); lastDate = sorted[sorted.length - 1].date; }
                let startDate = lastDate ? new Date(lastDate) : new Date(); startDate.setDate(startDate.getDate() + 1);
                const endDate = new Date(); endDate.setDate(endDate.getDate() - 1);
                let current = new Date(startDate); let days = 0; const toFill = [];
                while (current <= endDate && days < 30) {
                    const ds = current.toISOString().slice(0, 10);
                    if (!existingDates.has(ds) && isTradingDay(current)) toFill.push(ds);
                    current.setDate(current.getDate() + 1); days++;
                }
                if (toFill.length > 0) {
                    const cp = getTodayProfit(); toFill.forEach(ds => { if (!accountProfitHistory.find(i => i.date === ds)) accountProfitHistory.push({ date: ds, profit: round4(cp), estimated: true }); });
                    accountProfitHistory.sort((a, b) => a.date.localeCompare(b.date)); if (accountProfitHistory.length > 30) accountProfitHistory = accountProfitHistory.slice(-30); saveAll();
                }
            }

            function initPullToRefresh() {
                const container = document.getElementById('app'); const indicator = document.getElementById('pullIndicator'); const arrow = document.getElementById('pullArrow'); const status = document.getElementById('pullStatus'); const spinner = document.getElementById('pullSpinner');
                let startY = 0, isPulling = false, pullHeight = 0;
                container.addEventListener('touchstart', e => { if (window.scrollY > 5) return; startY = e.touches[0].clientY; isPulling = false; pullHeight = 0; }, { passive: true });
                container.addEventListener('touchmove', e => { if (isUpdating) return; if (window.scrollY > 5) { if (isPulling) { isPulling = false; indicator.classList.remove('show'); container.style.transform = ''; } return; } const dy = e.touches[0].clientY - startY; if (dy > 0 && dy < 120) { isPulling = true; pullHeight = Math.min(dy * 0.4, 60); container.style.transform = 'translateY(' + pullHeight + 'px)'; indicator.classList.add('show'); if (pullHeight > 30) { arrow.classList.add('flip'); status.textContent = '释放刷新'; } else { arrow.classList.remove('flip'); status.textContent = '下拉刷新'; } e.preventDefault(); } }, { passive: false });
                container.addEventListener('touchend', e => { if (!isPulling || isUpdating) { container.style.transform = ''; indicator.classList.remove('show'); return; } isPulling = false; if (pullHeight > 30) { isUpdating = true; arrow.classList.remove('flip'); arrow.style.display = 'none'; spinner.classList.add('active'); status.textContent = '刷新中...'; container.style.transform = 'translateY(36px)'; refreshData().then(() => { isUpdating = false; arrow.style.display = 'inline'; spinner.classList.remove('active'); status.textContent = '刷新完成'; container.style.transform = ''; setTimeout(() => indicator.classList.remove('show'), 600); }).catch(() => { isUpdating = false; arrow.style.display = 'inline'; spinner.classList.remove('active'); status.textContent = '刷新失败'; container.style.transform = ''; setTimeout(() => indicator.classList.remove('show'), 800); }); } else { container.style.transform = ''; indicator.classList.remove('show'); } pullHeight = 0; }, { passive: true });
            }

            function renderSummary() {
                if (privacyMode) { ['todayProfitBig', 'totalAssets', 'totalProfit', 'totalReturn'].forEach(id => { const el = document.getElementById(id); if (el) { el.textContent = '***'; el.className = 'stat-number privacy'; } }); document.getElementById('dataTimestamp').textContent = '净值日期：--'; return; }
                const codes = Object.keys(holdings); const s = computeSummary(); const todayEl = document.getElementById('todayProfitBig'); const tsEl = document.getElementById('dataTimestamp');
                if (!codes.length) {
                    todayEl.textContent = '+0.00'; todayEl.className = 'today-value neutral';
                    document.getElementById('totalAssets').textContent = '0.00'; document.getElementById('totalAssets').className = 'stat-number neutral';
                    document.getElementById('totalProfit').textContent = '+0.00'; document.getElementById('totalProfit').className = 'stat-number neutral';
                    document.getElementById('totalReturn').textContent = '0.00%'; document.getElementById('totalReturn').className = 'stat-number neutral';
                    tsEl.textContent = '净值日期：--'; return;
                }
                const val = s.todayProfit; todayEl.textContent = (val >= 0 ? '+' : '') + val.toFixed(2); todayEl.className = 'today-value ' + (val > 0 ? 'positive' : val < 0 ? 'negative' : 'neutral');
                const setStat = (id, v, pct) => { const el = document.getElementById(id); if (pct) { el.textContent = v.toFixed(2) + '%'; el.className = 'stat-number ' + (v > 0 ? 'positive' : v < 0 ? 'negative' : 'neutral'); } else { el.textContent = (v >= 0 ? '+' : '') + v.toFixed(2); el.className = 'stat-number ' + (v > 0 ? 'positive' : v < 0 ? 'negative' : 'neutral'); } };
                setStat('totalAssets', s.totalAsset, false); setStat('totalProfit', s.totalProfit, false); setStat('totalReturn', s.totalYield, true);
                let latestDate = ''; codes.forEach(code => { const d = getDisplayData(code); if (d.date && d.nav > 0 && d.date > latestDate) latestDate = d.date; });
                tsEl.textContent = '净值日期：' + (latestDate || '--');
            }

            function renderFundList() {
                const container = document.getElementById('fundList'); const codes = Object.keys(holdings);
                if (!codes.length) { container.innerHTML = '<div class="empty-state"><i class="fas fa-inbox"></i><p>还没有持仓基金</p><div class="sub">点击底部「添加持仓」</div></div>'; if (editMode) { editMode = false; updateBottomBar(); } return; }
                const sorted = codes.slice().sort((a, b) => { const ma = (getDisplayData(a).nav || parseFloat(holdings[a].cost) || 0) * (parseFloat(holdings[a].shares) || 0); const mb = (getDisplayData(b).nav || parseFloat(holdings[b].cost) || 0) * (parseFloat(holdings[b].shares) || 0); return mb - ma; });
                let html = ''; sorted.forEach(code => {
                    const data = getCardData(code); if (!data) return;
                    const dayRateStr = data.dayRate !== null ? (data.dayRate >= 0 ? '+' : '') + data.dayRate.toFixed(2) + '%' : '--';
                    const dayProfitStr = formatMoney(data.dayProfit); const holdProfitStr = formatMoney(data.holdProfit);
                    const holdYieldStr = data.holdYield !== null ? (data.holdYield >= 0 ? '+' : '') + data.holdYield.toFixed(2) + '%' : '--';
                    const cls = data.dayRate > 0 ? 'positive' : (data.dayRate < 0 ? 'negative' : 'neutral');
                    const displayName = data.name.length > 14 ? data.name.slice(0, 14) + '…' : data.name;
                    let decorClass = 'decor-old'; const display = getDisplayData(code);
                    if (display.date && display.nav > 0) { const nd = new Date(display.date + 'T00:00:00'); const now = new Date(); const nxt = new Date(nd); nxt.setDate(nxt.getDate() + 1); while (!isTradingDay(nxt)) nxt.setDate(nxt.getDate() + 1); nxt.setHours(9, 0, 0, 0); if (now >= nd && now <= nxt) decorClass = 'decor-today'; }
                    html += `<div class="fund-card ${decorClass}${editMode ? ' edit-mode' : ''}" data-code="${code}">
                        <div class="fund-content">
                            <div class="fund-row fund-row-top">
                                <div class="fund-name-wrap"><span class="fund-name">${escapeHTML(displayName)}</span></div>
                                <div class="fund-code-wrap"><span class="fund-code-standalone">${code}</span></div>
                                <div class="fund-right-actions"><span class="fund-market-value"><i class="fas fa-coins coin-icon"></i> ¥${data.marketValue.toFixed(2)}</span></div>
                            </div>
                            <div class="fund-row-metrics">
                                <div class="metric-item"><span class="metric-label">最新收益率</span><span class="metric-value ${cls}">${dayRateStr}</span></div>
                                <div class="metric-item"><span class="metric-label">最新盈亏</span><span class="metric-value ${data.dayProfit > 0 ? 'positive' : data.dayProfit < 0 ? 'negative' : 'neutral'}">${dayProfitStr}</span></div>
                                <div class="metric-item"><span class="metric-label">持有收益率</span><span class="metric-value ${data.holdYield > 0 ? 'positive' : data.holdYield < 0 ? 'negative' : 'neutral'}">${holdYieldStr}</span></div>
                                <div class="metric-item"><span class="metric-label">持有盈亏</span><span class="metric-value ${data.holdProfit > 0 ? 'positive' : data.holdProfit < 0 ? 'negative' : 'neutral'}">${holdProfitStr}</span></div>
                            </div>
                            <div class="fund-edit-area ${editMode ? 'active' : ''}" data-code="${code}">
                                <div class="edit-row">
                                    <input type="number" class="edit-input" id="editCost_${code}" value="${data.cost.toFixed(4)}" step="any" inputmode="decimal" placeholder="成本">
                                    <input type="number" class="edit-input" id="editShares_${code}" value="${data.shares.toFixed(2)}" step="any" inputmode="decimal" placeholder="份额">
                                    <input type="text" class="edit-input" id="editTag_${code}" value="${escapeHTML(industryTags[code] || '')}" placeholder="行业标签">
                                    <button class="edit-delete-btn" data-code="${code}">删除</button>
                                </div>
                                <div class="edit-hint"><span class="current-cost">当前成本: ${data.cost.toFixed(4)}</span><span class="hint-tip">💡 修改后持有收益将重新计算</span></div>
                            </div>
                        </div>
                    </div>`;
                });
                container.innerHTML = html;
                if (editMode) container.querySelectorAll('.edit-delete-btn').forEach(btn => btn.addEventListener('click', function(e) { e.stopPropagation(); deleteFund(this.getAttribute('data-code')); }));
                updateBottomBar();
            }

            function renderProfitChart() {
                const canvas = document.getElementById('profitChartCanvas'), emptyEl = document.getElementById('chartEmpty');
                if (!canvas || !emptyEl) return;
                if (profitChart) { profitChart.destroy(); profitChart = null; }
                if (accountProfitHistory.length === 0) { canvas.style.display = 'none'; emptyEl.style.display = 'flex'; return; }
                canvas.style.display = 'block'; emptyEl.style.display = 'none';
                const sorted = accountProfitHistory.slice().sort((a, b) => a.date.localeCompare(b.date));
                const labels = sorted.map(i => i.date.slice(5)); const data = sorted.map(i => i.profit);
                const colors = data.map(v => v >= 0 ? '#D96060' : '#3AAD9F');
                profitChart = new Chart(canvas.getContext('2d'), {
                    type: 'bar', data: { labels, datasets: [{ data, backgroundColor: colors, borderRadius: 4, barPercentage: 0.6, categoryPercentage: 0.8 }] },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { backgroundColor: 'rgba(255,255,255,0.95)', titleColor: '#0b1a33', bodyColor: '#0b1a33', borderColor: 'rgba(0,0,0,0.06)', borderWidth: 1, cornerRadius: 10, padding: 8, callbacks: { label: ctx => (ctx.parsed.y >= 0 ? '+' : '') + ctx.parsed.y.toFixed(2) + ' 元' } } }, scales: { x: { ticks: { color: '#94a3b8', font: { size: 8 }, maxTicksLimit: 10 }, grid: { color: 'rgba(0,0,0,0.06)', drawBorder: false } }, y: { ticks: { color: '#94a3b8', font: { size: 8 }, callback: v => (v >= 0 ? '+' : '') + v.toFixed(0) }, grid: { color: 'rgba(0,0,0,0.06)', drawBorder: false } } } }
                });
            }

            function renderPieChart() {
                const canvas = document.getElementById('pieChartCanvas'), emptyEl = document.getElementById('analysisEmpty');
                const leftL = document.getElementById('legendLeft'), rightL = document.getElementById('legendRight'), wrap = document.getElementById('chartCanvasWrap');
                if (!canvas || !leftL || !rightL) return;
                const codes = Object.keys(holdings);
                if (!codes.length) {
                    if (pieChart) { pieChart.destroy(); pieChart = null; } canvas.style.display = 'none'; wrap.style.display = 'none'; leftL.innerHTML = ''; rightL.innerHTML = ''; emptyEl.style.display = 'block'; return;
                }
                const industryMap = {}; let total = 0; codes.forEach(code => { const d = getCardData(code); if (!d || d.marketValue <= 0) return; const tag = industryTags[code] || '未分类'; industryMap[tag] = (industryMap[tag] || 0) + d.marketValue; total += d.marketValue; });
                if (total <= 0 || Object.keys(industryMap).length === 0) { if (pieChart) { pieChart.destroy(); pieChart = null; } canvas.style.display = 'none'; wrap.style.display = 'none'; leftL.innerHTML = ''; rightL.innerHTML = ''; emptyEl.style.display = 'block'; return; }
                canvas.style.display = 'block'; wrap.style.display = 'block'; emptyEl.style.display = 'none';
                const labels = Object.keys(industryMap), values = labels.map(k => industryMap[k]), colors = DEEP_OCEAN.slice(0, labels.length);
                if (pieChart) { pieChart.destroy(); pieChart = null; }
                pieChart = new Chart(canvas.getContext('2d'), {
                    type: 'pie', data: { labels, datasets: [{ data: values, backgroundColor: colors, borderColor: '#ffffff', borderWidth: 2, hoverBorderWidth: 3, hoverBorderColor: '#ffffff', hoverOffset: 6, borderRadius: 4, spacing: 2 }] },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { backgroundColor: 'rgba(255,255,255,0.95)', titleColor: '#0b1a33', bodyColor: '#0b1a33', borderColor: 'rgba(0,0,0,0.06)', borderWidth: 1, cornerRadius: 8, padding: 6, callbacks: { label: ctx => { const v = ctx.parsed; return ctx.label + ': ¥' + v.toFixed(2) + ' (' + (v / total * 100).toFixed(1) + '%)'; } } } }, animation: { animateRotate: true, duration: 500 } }
                });
                const half = Math.ceil(labels.length / 2);
                leftL.innerHTML = labels.slice(0, half).map((l, i) => `<div class="legend-item"><span class="legend-dot" style="background:${colors[i]};"></span>${l} (${(values[i] / total * 100).toFixed(1)}%)</div>`).join('');
                rightL.innerHTML = labels.slice(half).map((l, i) => { const idx = half + i; return `<div class="legend-item"><span class="legend-dot" style="background:${colors[idx]};"></span>${l} (${(values[idx] / total * 100).toFixed(1)}%)</div>`; }).join('');
            }

            function renderAll() { renderSummary(); renderFundList(); renderProfitChart(); renderPieChart(); const cb = document.getElementById('chartBlock'), ab = document.getElementById('analysisBlock'); if (editMode) { cb.classList.add('edit-hidden'); ab.classList.add('edit-hidden'); } else { cb.classList.remove('edit-hidden'); ab.classList.remove('edit-hidden'); } updateBottomBar(); }

            function updateBottomBar() {
                const bar = document.getElementById('bottomActions');
                ['openAddModalBtn', 'batchEditBtn', 'openBackupModalBtn', 'refreshBtn'].forEach(id => { const el = document.getElementById(id); const n = el.cloneNode(true); el.parentNode.replaceChild(n, el); });
                const add = document.getElementById('openAddModalBtn'), batch = document.getElementById('batchEditBtn'), data = document.getElementById('openBackupModalBtn'), ref = document.getElementById('refreshBtn');
                if (editMode) {
                    bar.classList.add('edit-mode'); add.style.display = 'none'; data.style.display = 'none'; ref.style.display = 'none';
                    batch.innerHTML = '<div class="icon-wrap"><i class="fas fa-check"></i></div><span class="label">完成编辑</span>'; batch.className = 'action-btn edit-highlight'; batch.style.display = 'flex';
                    batch.addEventListener('click', e => { e.stopPropagation(); exitEditMode(); });
                } else {
                    bar.classList.remove('edit-mode'); add.style.display = 'flex'; data.style.display = 'flex'; ref.style.display = 'flex'; batch.style.display = 'flex';
                    add.innerHTML = '<div class="icon-wrap"><i class="fas fa-plus-circle"></i></div><span class="label">添加持仓</span>'; add.className = 'action-btn'; add.addEventListener('click', e => { e.stopPropagation(); if (editMode) return; const ic = add.querySelector('.icon-wrap'); if (ic) { ic.classList.remove('pop'); void ic.offsetWidth; ic.classList.add('pop'); } document.getElementById('modalOverlay').classList.add('active'); });
                    batch.innerHTML = '<div class="icon-wrap"><i class="fas fa-pen"></i></div><span class="label">批量编辑</span>'; batch.className = 'action-btn'; batch.addEventListener('click', e => { e.stopPropagation(); enterEditMode(); });
                    data.innerHTML = '<div class="icon-wrap"><i class="fas fa-database"></i></div><span class="label">数据管理</span>'; data.className = 'action-btn'; data.addEventListener('click', e => { e.stopPropagation(); if (editMode) { showAlert('请先完成编辑'); return; } const ic = data.querySelector('.icon-wrap'); if (ic) { ic.classList.remove('pop'); void ic.offsetWidth; ic.classList.add('pop'); } document.getElementById('backupModalOverlay').classList.add('active'); });
                    ref.innerHTML = '<div class="icon-wrap"><i class="fas fa-sync-alt"></i></div><span class="label">刷新净值</span>'; ref.className = 'action-btn'; ref.addEventListener('click', e => { e.stopPropagation(); const ic = ref.querySelector('.icon-wrap'); if (ic) { ic.classList.remove('pop'); void ic.offsetWidth; ic.classList.add('pop'); } refreshData(); });
                }
            }

            async function refreshData() {
                if (isUpdating) return; showCheck(); isUpdating = true;
                const timeout = setTimeout(() => { if (isUpdating) { isUpdating = false; console.log('刷新超时'); } }, 15000);
                try { const codes = Object.keys(holdings); if (codes.length) { for (let c of codes) await fetchFundDataOnlyForce(c); saveTodaySnapshot(); } renderAll(); } catch (e) { showAlert('刷新失败'); } finally { clearTimeout(timeout); isUpdating = false; }
            }
            function showCheck() { const el = document.getElementById('checkPop'); if (el) { el.classList.remove('show'); void el.offsetWidth; el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 600); } }

            function enterEditMode() { if (!Object.keys(holdings).length) { showAlert('暂无持仓'); return; } editMode = true; renderAll(); }
            function exitEditMode() {
                const codes = Object.keys(holdings); let changed = false;
                codes.forEach(code => {
                    const ci = document.getElementById('editCost_' + code), si = document.getElementById('editShares_' + code), ti = document.getElementById('editTag_' + code);
                    if (ci && si) { const nc = parseFloat(ci.value), ns = parseFloat(si.value), nt = ti ? ti.value.trim() : ''; if (!isNaN(nc) && nc > 0 && !isNaN(ns) && ns > 0) { if (holdings[code].cost !== round4(nc) || holdings[code].shares !== round4(ns)) { holdings[code].cost = round4(nc); holdings[code].shares = round4(ns); changed = true; } if (industryTags[code] !== nt) { if (nt) industryTags[code] = nt; else delete industryTags[code]; changed = true; } } }
                });
                if (changed) { saveAll(); refreshData(); } editMode = false; renderAll();
            }
            function deleteFund(code) { showConfirm('确定删除 ' + code + ' 吗？').then(ok => { if (!ok) return; delete holdings[code]; delete fundDataCache[code]; delete industryTags[code]; saveAll(); if (!Object.keys(holdings).length && editMode) editMode = false; renderAll(); }); }

            const promptOverlay = document.getElementById('promptModalOverlay'), promptTitle = document.getElementById('promptTitle'), promptMessage = document.getElementById('promptMessage'), promptActions = document.getElementById('promptActions');
            let promptResolve = null;
            function showPrompt(title, msg, btns) {
                if (promptResolve) { promptResolve(null); promptResolve = null; } return new Promise(resolve => { promptResolve = resolve; promptTitle.textContent = title; promptMessage.textContent = msg; promptActions.innerHTML = ''; btns.forEach(b => { const btn = document.createElement('button'); btn.textContent = b.text; btn.className = b.cls || 'btn-confirm'; btn.onclick = () => { promptOverlay.classList.remove('active'); const cb = promptResolve; promptResolve = null; if (cb) cb(b.value); }; promptActions.appendChild(btn); }); promptOverlay.classList.add('active'); });
            }
            function showAlert(msg) { return showPrompt('提示', msg, [{ text: '确定', cls: 'btn-confirm', value: true }]); }
            function showConfirm(msg) { return showPrompt('确认', msg, [{ text: '取消', cls: 'btn-cancel', value: false }, { text: '确定', cls: 'btn-danger', value: true }]); }
            promptOverlay.addEventListener('click', e => { if (e.target === promptOverlay && promptResolve) { promptOverlay.classList.remove('active'); const cb = promptResolve; promptResolve = null; if (cb) cb(null); } });

            function setupModal() {
                const overlay = document.getElementById('modalOverlay'), closeBtn = document.getElementById('closeModalBtn'), confirmBtn = document.getElementById('confirmAddBtn'), codeInput = document.getElementById('fundCodeInput'), costInput = document.getElementById('fundCostInput'), sharesInput = document.getElementById('fundSharesInput'), industryInput = document.getElementById('fundIndustryInput'), closeCircle = document.getElementById('closeModalBtnCircle'), infoBox = document.getElementById('autoFillInfo'), infoText = document.getElementById('autoFillText');
                let fetchName = '', timer = null;
                document.getElementById('openAddModalBtn').addEventListener('click', () => { if (editMode) return; const icon = document.querySelector('#openAddModalBtn .icon-wrap'); if (icon) { icon.classList.remove('pop'); void icon.offsetWidth; icon.classList.add('pop'); } confirmBtn.disabled = true; codeInput.value = costInput.value = sharesInput.value = industryInput.value = ''; infoBox.classList.remove('show'); fetchName = ''; overlay.classList.add('active'); setTimeout(() => codeInput.focus(), 300); });
                function close() { overlay.classList.remove('active'); fetchName = ''; } closeBtn.onclick = close; closeCircle.onclick = close; overlay.addEventListener('click', e => { if (e.target === overlay) close(); });
                codeInput.addEventListener('input', function() { const code = this.value.trim(); clearTimeout(timer); if (code.length === 6 && /^\d{6}$/.test(code)) { timer = setTimeout(() => { fetchTxFund(code).then(d => { if (d && d.name) { fetchName = d.name; infoText.textContent = '已识别：' + d.name; infoBox.classList.add('show'); confirmBtn.disabled = false; } else { infoBox.classList.remove('show'); confirmBtn.disabled = true; fetchName = ''; } }).catch(() => { infoBox.classList.remove('show'); confirmBtn.disabled = true; fetchName = ''; }); }, 400); } else { infoBox.classList.remove('show'); confirmBtn.disabled = true; fetchName = ''; } });
                confirmBtn.addEventListener('click', async function() {
                    if (this.disabled) return; this.disabled = true;
                    try {
                        const code = codeInput.value.trim(), cost = parseFloat(costInput.value), shares = parseFloat(sharesInput.value), industry = industryInput.value.trim();
                        if (code.length !== 6 || !/^\d{6}$/.test(code)) { await showAlert('请输入6位数字代码'); return; }
                        if (isNaN(cost) || cost <= 0) { await showAlert('请输入有效成本价'); return; }
                        if (isNaN(shares) || shares <= 0) { await showAlert('请输入有效份额'); return; }
                        if (!industry) { await showAlert('请输入行业标签'); return; }
                        let name = fetchName; if (!name) { try { const d = await fetchTxFund(code); if (d && d.name) name = d.name; } catch (e) {} }
                        if (!name) { await showAlert('未能识别基金代码'); return; }
                        if (holdings[code]) { const ok = await showConfirm('已存在 ' + name + '，是否覆盖？'); if (!ok) return; }
                        holdings[code] = { cost: round4(cost), shares: round4(shares), name }; industryTags[code] = industry; saveAll(); close(); await fetchFundDataOnly(code); renderAll();
                    } catch (e) { showAlert('添加失败'); } finally { this.disabled = false; }
                });
            }

            function setupBackup() {
                const overlay = document.getElementById('backupModalOverlay'), closeCircle = document.getElementById('closeBackupModalBtnCircle');
                document.getElementById('openBackupModalBtn').addEventListener('click', () => { if (editMode) { showAlert('请先完成编辑'); return; } const icon = document.querySelector('#openBackupModalBtn .icon-wrap'); if (icon) { icon.classList.remove('pop'); void icon.offsetWidth; icon.classList.add('pop'); } overlay.classList.add('active'); });
                function close() { overlay.classList.remove('active'); } closeCircle.onclick = close; overlay.addEventListener('click', e => { if (e.target === overlay) close(); });
                document.getElementById('exportBtn').addEventListener('click', e => { e.stopPropagation(); const blob = new Blob([JSON.stringify({ holdings, fundDataCache, accountProfitHistory, industryTags }, null, 2)], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'iFunds_backup_' + getToday() + '.json'; a.click(); });
                document.getElementById('importFileInput').addEventListener('change', async function(e) { e.stopPropagation(); const file = this.files[0]; if (!file) return; const reader = new FileReader(); reader.onload = async ev => { try { const data = JSON.parse(ev.target.result); if (!data.holdings || typeof data.holdings !== 'object') { await showAlert('格式无效'); return; } const ok = await showConfirm('将导入 ' + Object.keys(data.holdings).length + ' 只基金，覆盖当前数据？'); if (ok) { holdings = data.holdings || {}; fundDataCache = data.fundDataCache || {}; accountProfitHistory = data.accountProfitHistory || []; industryTags = data.industryTags || {}; saveAll(); close(); await refreshData(); } } catch (_) { await showAlert('文件解析失败'); } }; reader.readAsText(file); this.value = ''; });
                document.getElementById('clearCacheBtn').addEventListener('click', async e => { e.stopPropagation(); if (await showConfirm('清除所有缓存数据？')) { fundDataCache = {}; saveAll(); close(); await refreshData(); showAlert('缓存已清除'); } });
                document.getElementById('hardResetBtn').addEventListener('click', async e => { e.stopPropagation(); if (await showConfirm('⚠️ 硬重置将清除所有数据并重新加载页面，确定吗？')) { hardReset(); location.reload(); } });
            }

            let clickCount = 0, clickTimer = null;
            function setupPrivacy() { document.getElementById('summaryCard').addEventListener('click', e => { if (e.target.closest('button')) return; clearTimeout(clickTimer); clickCount++; clickTimer = setTimeout(() => { if (clickCount >= 3) { privacyMode = !privacyMode; if (privacyMode) { ['todayProfitBig', 'totalAssets', 'totalProfit', 'totalReturn'].forEach(id => { const el = document.getElementById(id); if (el) { el.textContent = '***'; el.className = 'stat-number privacy'; } }); document.getElementById('dataTimestamp').textContent = '净值日期：--'; } else renderSummary(); clickCount = 0; } }, 400); }); }

            function registerSW() { if ('serviceWorker' in navigator) { navigator.serviceWorker.register('./sw.js').then(r => console.log('SW ok')).catch(e => console.warn('SW fail')); } }

            function init() {
                loadData(); if (Object.keys(holdings).length > 0) backfillProfitHistory();
                setupPrivacy(); renderAll(); if (Object.keys(holdings).length) refreshData();
                setupModal(); setupBackup(); initPullToRefresh(); registerSW(); console.log('✅ iFunds 已启动（双栏图例饼图）');
            }
            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
        })();
    </script>
</body>
</html>
