<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>iFamily</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="icon-1024.png">
    <link rel="apple-touch-icon-precomposed" href="icon-1024.png">
    <meta name="theme-color" content="#FDF3E5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        /* ========== 基础变量（默认枫叶红主题，底色已微调） ========== */
        :root {
            --color-deep: #912130;
            --color-mid1: #D95662;
            --color-mid2: #F48D8E;
            --color-light1: #F8E6DC; /* 原 #FDF3E5，加深了一点 */
            --color-light2: #F6DAC8;
            --card-bg: rgba(255, 255, 255, 0.72);
            --card-bg-hover: rgba(255, 255, 255, 0.85);
            --text-primary: #1c1c1e;
            --text-secondary: #8e8e93;
            --text-tertiary: #aeaeb2;
            --ring-color: #D95662;
            --bg-color: #F2F2F7;
            --modal-bg: #ffffff;
            --modal-border: rgba(255, 255, 255, 0.3);
            --input-bg: #f5f5f7;
            --input-border: #e5e5ea;
            --btn-cancel-bg: rgba(145, 33, 48, 0.06);
            --card-shadow: 0 2px 16px rgba(145, 33, 48, 0.06);
            --badge-passed-bg: rgba(224, 141, 142, 0.18);
            --badge-remain-bg: rgba(244, 141, 142, 0.18);
            --empty-illustration-stroke: var(--color-mid1);
        }

        /* 克莱因蓝 */
        body[data-theme="klein"] {
            --color-deep: #002FA7; --color-mid1: #0057B7; --color-mid2: #7FAED4;
            --color-light1: #E9EEF8; /* 原 #F0F4FF */
            --color-light2: #D0DFFF; --ring-color: #0057B7; --bg-color: #F2F5FF;
            --btn-cancel-bg: rgba(0,47,167,0.06); --card-shadow: 0 2px 16px rgba(0,47,167,0.08);
            --badge-passed-bg: rgba(0,87,183,0.12); --badge-remain-bg: rgba(0,87,183,0.18);
        }
        body[data-theme="peach"] {
            --color-deep: #C8655A; --color-mid1: #E69D8C; --color-mid2: #F4C4B8;
            --color-light1: #FDE9E4; /* 原 #FFF2EF */
            --color-light2: #FDE4DC; --ring-color: #E69D8C; --bg-color: #FFF5F3;
            --btn-cancel-bg: rgba(200,101,90,0.06); --card-shadow: 0 2px 16px rgba(200,101,90,0.08);
            --badge-passed-bg: rgba(230,157,140,0.15); --badge-remain-bg: rgba(230,157,140,0.2);
        }
        body[data-theme="brown"] {
            --color-deep: #6B4B3E; --color-mid1: #B68B7E; --color-mid2: #D4B5A8;
            --color-light1: #F5EDE7; /* 原 #FAF6F3 */
            --color-light2: #EFE5DE; --ring-color: #B68B7E; --bg-color: #F7F4F1;
            --btn-cancel-bg: rgba(107,75,62,0.06); --card-shadow: 0 2px 16px rgba(107,75,62,0.08);
            --badge-passed-bg: rgba(182,139,126,0.15); --badge-remain-bg: rgba(182,139,126,0.2);
        }
        body[data-theme="grey"] {
            --color-deep: #4A4A4A; --color-mid1: #8E8E93; --color-mid2: #B0B0B5;
            --color-light1: #EBEAE5; /* 原 #F5F5F0 */
            --color-light2: #E0E0DB; --ring-color: #8E8E93; --bg-color: #F2F2F0;
            --btn-cancel-bg: rgba(74,74,74,0.06); --card-shadow: 0 2px 16px rgba(74,74,74,0.08);
            --badge-passed-bg: rgba(142,142,147,0.12); --badge-remain-bg: rgba(142,142,147,0.18);
        }
        body[data-theme="ice"] {
            --color-deep: #1D7874; --color-mid1: #4ECDC4; --color-mid2: #8FE0D8;
            --color-light1: #E6F5F3; /* 原 #F0FCFB */
            --color-light2: #D4F7F4; --ring-color: #4ECDC4; --bg-color: #F2FAF9;
            --btn-cancel-bg: rgba(29,120,116,0.06); --card-shadow: 0 2px 16px rgba(29,120,116,0.08);
            --badge-passed-bg: rgba(78,205,196,0.15); --badge-remain-bg: rgba(78,205,196,0.22);
        }
        body[data-theme="violet"] {
            --color-deep: #3A2C4F; --color-mid1: #8B6BB3; --color-mid2: #B79FE0;
            --color-light1: #EDE8F5; /* 原 #F4F1FA */
            --color-light2: #E2D9F3; --ring-color: #8B6BB3; --bg-color: #F6F4FA;
            --btn-cancel-bg: rgba(58,44,79,0.06); --card-shadow: 0 2px 16px rgba(58,44,79,0.08);
            --badge-passed-bg: rgba(139,107,179,0.15); --badge-remain-bg: rgba(139,107,179,0.2);
        }
        body[data-theme="ocean"] {
            --color-deep: #1D4E89; --color-mid1: #4A7FB5; --color-mid2: #7FAED4;
            --color-light1: #DEE8F2; /* 原 #E8F1F8 */
            --color-light2: #C5D9EC; --ring-color: #4A7FB5; --bg-color: #F2F5F8;
            --btn-cancel-bg: rgba(29,78,137,0.06); --card-shadow: 0 2px 16px rgba(29,78,137,0.06);
            --badge-passed-bg: rgba(74,127,181,0.15); --badge-remain-bg: rgba(74,127,181,0.2);
        }
        body[data-theme="forest"] {
            --color-deep: #2D6A4F; --color-mid1: #52B788; --color-mid2: #95D5B2;
            --color-light1: #E6F0E9; /* 原 #F0F7F4 */
            --color-light2: #D8EFE4; --ring-color: #52B788; --bg-color: #F2F7F4;
            --btn-cancel-bg: rgba(45,106,79,0.06); --card-shadow: 0 2px 16px rgba(45,106,79,0.06);
            --badge-passed-bg: rgba(82,183,136,0.15); --badge-remain-bg: rgba(82,183,136,0.2);
        }
        body[data-theme="orange"] {
            --color-deep: #C85A17; --color-mid1: #E67E22; --color-mid2: #F0A04B;
            --color-light1: #FDEBDE; /* 原 #FFF6ED */
            --color-light2: #FDE4CE; --ring-color: #E67E22; --bg-color: #FDF8F3;
            --btn-cancel-bg: rgba(200,90,23,0.06); --card-shadow: 0 2px 16px rgba(200,90,23,0.06);
            --badge-passed-bg: rgba(230,126,34,0.15); --badge-remain-bg: rgba(230,126,34,0.2);
        }

        /* ========== 全局样式 ========== */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Noto Sans SC', sans-serif; -webkit-font-smoothing: antialiased; height: 100%; background-color: var(--bg-color); }
        body { background-color: var(--bg-color); min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; padding: 0; position: relative; overflow-x: hidden; -webkit-user-select: none; user-select: none; overscroll-behavior: none; transition: background-color 0.4s ease; }
        .app-container { width: 100%; max-width: 393px; padding: 18px 16px 0; display: flex; flex-direction: column; gap: 12px; background-color: var(--bg-color); min-height: 100vh; transition: background-color 0.4s ease; }
        .header { padding: 4px 2px 2px; padding-top: calc(4px + env(safe-area-inset-top, 0px)); display: flex; align-items: center; justify-content: space-between; }
        .header-left { display: flex; flex-direction: column; }
        .header-brand { font-weight: 600; font-size: 24px; line-height: 1.2; color: var(--color-deep); letter-spacing: -0.02em; cursor: pointer; user-select: none; transition: color 0.4s ease, opacity 0.15s; }
        .header-brand.pressed { opacity: 0.5; }
        .header-subtitle { font-weight: 400; font-size: 12px; color: var(--text-tertiary); margin-top: 2px; transition: color 0.4s ease; }
        .header-add-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--color-deep); color: var(--color-light1); border: none; font-size: 22px; line-height: 1; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.15s, background-color 0.4s; box-shadow: 0 2px 12px rgba(0,0,0,0.1); }
        .header-add-btn:active { transform: scale(0.9); }
        .empty-mode .header-add-btn { display: none; }

        .hero-card { background: var(--card-bg); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); border-radius: 20px; padding: 14px 18px 16px; box-shadow: var(--card-shadow); border: 1px solid var(--modal-border); display: none; flex-direction: column; gap: 8px; cursor: pointer; transition: background-color 0.4s, border-color 0.4s; }
        .hero-card:active { transform: scale(0.985); }
        .hero-card.long-press-hint { box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.2); }
        .hero-card .event-name { font-weight: 600; font-size: 15px; color: var(--color-deep); }
        .hero-card .event-date-sub { font-size: 13px; color: var(--text-secondary); }
        .hero-days-row { display: flex; gap: 16px; padding-top: 2px; }
        .hero-days-item { flex: 1; }
        .hero-days-num { font-weight: 200; font-size: 30px; color: var(--color-deep); }
        .hero-days-num.today-num { color: var(--color-mid1); animation: todayPulse 2s ease-in-out infinite; }
        .hero-days-num.future-num { color: var(--text-tertiary); font-size: 24px; }
        @keyframes todayPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.06)} }
        .hero-days-label { font-size: 11px; color: var(--text-tertiary); margin-top: 1px; }

        .empty-state { flex: 0 1 auto; display: none; flex-direction: column; align-items: center; padding: 10px 12px; max-width: 200px; margin: 0 auto; background: var(--card-bg); backdrop-filter: blur(20px); border-radius: 20px; box-shadow: var(--card-shadow); border: 1px solid var(--modal-border); }
        .empty-state.show { display: flex; }
        .empty-illustration { margin-bottom: 12px; width: 60px; height: 60px; opacity: 0.6; }
        .empty-illustration svg { width: 100%; height: 100%; fill: none; stroke: var(--empty-illustration-stroke); stroke-width: 1.5; }
        .empty-text { font-weight: 600; font-size: 14px; color: var(--color-deep); margin-bottom: 2px; }
        .empty-sub { font-size: 12px; color: var(--text-tertiary); margin-bottom: 12px; }
        .empty-tap-hint { background: var(--color-deep); color: var(--color-light1); border-radius: 9999px; padding: 8px 16px; font-weight: 600; font-size: 12px; cursor: pointer; border: none; transition: transform 0.15s, background-color 0.4s; }
        .empty-tap-hint:active { transform: scale(0.94); }

        .swipe-wrapper { position: relative; overflow: hidden; border-radius: 16px; touch-action: pan-y; margin-top: 6px; height: 60px; }
        .swipe-wrapper:not(:last-child)::after { content: ''; position: absolute; bottom: -6px; left: 14px; right: 14px; height: 1px; background: rgba(0,0,0,0.04); z-index: 2; pointer-events: none; }
        .swipe-inner { display: flex; width: 100%; height: 100%; will-change: transform; transition: transform .28s cubic-bezier(.25,.8,.25,1.2); }
        .swipe-wrapper.open .swipe-inner { transform: translateX(-72px); }
        .card-content { flex: 0 0 100%; padding: 0 14px; display: flex; align-items: center; gap: 12px; background: var(--card-bg); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border-radius: 16px; box-shadow: var(--card-shadow); border: 1px solid var(--modal-border); cursor: pointer; transition: background-color 0.4s; }
        .card-content:active { background: var(--card-bg-hover); }
        .swipe-delete { flex: 0 0 72px; display: flex; align-items: center; justify-content: center; }
        .swipe-delete .delete-circle { width: 48px; height: 48px; border-radius: 50%; background: var(--color-deep); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; transition: transform 0.15s, background-color 0.4s; box-shadow: 0 2px 12px rgba(0,0,0,0.2); }
        .swipe-delete:active .delete-circle { transform: scale(0.9); background: var(--color-mid1); }
        .swipe-delete .delete-circle svg { width: 20px; height: 20px; fill: #fff; }
        .swipe-delete .delete-label { font-weight: 600; font-size: 10px; color: #fff; }

        .card-ring { flex-shrink: 0; width: 34px; height: 34px; position: relative; display: flex; align-items: center; justify-content: center; }
        .card-ring svg { width: 34px; height: 34px; transform: rotate(-90deg); }
        .card-ring .ring-bg { fill: none; stroke: var(--color-light2); stroke-width: 5; }
        .card-ring .ring-fg { fill: none; stroke: var(--ring-color); stroke-width: 5; stroke-linecap: round; transition: stroke-dashoffset 0.8s cubic-bezier(0.4, 0, 0.2, 1); }
        .card-center { flex: 1; min-width: 0; }
        .card-center .card-name { font-weight: 600; font-size: 15px; color: var(--color-deep); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-center .card-date { font-size: 13px; color: var(--text-tertiary); margin-top: 1px; }
        .card-right { display: flex; gap: 8px; flex-shrink: 0; }
        .badge { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 64px; padding: 4px 4px 5px; border-radius: 8px; transition: background-color 0.4s; }
        .badge .badge-label { font-size: 9px; color: var(--text-tertiary); letter-spacing: 0.04em; text-transform: uppercase; }
        .badge .badge-number { font-weight: 200; font-size: 20px; color: var(--text-primary); }
        .badge.passed-badge { background: var(--badge-passed-bg); }
        .badge.passed-badge .badge-number { color: var(--color-mid1); }
        .badge.passed-badge .badge-number.future-badge-number { color: var(--text-tertiary); font-size: 20px; }
        .badge.remain-badge { background: var(--badge-remain-bg); }
        .badge.remain-badge .badge-number { color: var(--color-mid1); }
        .badge.today-badge { background: var(--color-deep); animation: todayBadgeGlow 2.5s ease-in-out infinite; }
        @keyframes todayBadgeGlow { 0%,100%{box-shadow:0 0 0 0 rgba(0,0,0,0.15)} 50%{box-shadow:0 0 0 8px rgba(0,0,0,0.05)} }
        .badge.today-badge .badge-label { color: var(--color-light1); }
        .badge.today-badge .badge-number { color: var(--color-light1); font-size: 18px; }

        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.3); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0; visibility: hidden; transition: opacity .3s, visibility .3s; padding: 20px; }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-glass { width: 100%; max-width: 360px; background: var(--modal-bg); border-radius: 20px; padding: 20px 16px 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); border: 1px solid var(--modal-border); transform: scale(0.9); transition: transform .38s cubic-bezier(.25,.8,.25,1.15), background-color 0.4s; position: relative; }
        .modal-overlay.active .modal-glass { transform: scale(1); }
        .modal-close-btn { position: absolute; top: 14px; right: 14px; width: 32px; height: 32px; border-radius: 50%; background: rgba(0,0,0,0.05); border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .modal-close-btn svg { width: 16px; height: 16px; stroke: var(--text-secondary); fill: none; stroke-width: 2; }
        .modal-title, .calendar-glass .cal-title { font-weight: 600; font-size: 18px; color: var(--color-deep); text-align: center; margin-bottom: 22px; margin-top: 4px; }
        .input-group { margin-bottom: 12px; }
        .input-group label { font-weight: 600; font-size: 10px; color: var(--text-tertiary); letter-spacing: 0.06em; text-transform: uppercase; display: block; margin-bottom: 4px; }
        .modal-glass input[type="text"] { width: 100%; padding: 12px 14px; border: 1.5px solid var(--input-border); border-radius: 12px; font-size: 15px; background: var(--input-bg); color: var(--text-primary); outline: none; transition: border 0.2s; }
        .modal-glass input[type="text"]:focus { border-color: var(--color-deep); background: #fff; }
        .date-trigger { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; background: var(--input-bg); border: 1.5px solid var(--input-border); border-radius: 12px; cursor: pointer; }
        .date-trigger .label-text { font-size: 13px; color: var(--text-tertiary); }
        .date-trigger .value { font-size: 15px; color: var(--color-deep); }
        .btn-submit { width: 100%; padding: 13px; background: var(--color-deep); color: var(--color-light1); border: none; border-radius: 9999px; font-weight: 600; font-size: 15px; cursor: pointer; margin-top: 16px; transition: transform 0.12s, background-color 0.4s; }
        .btn-submit:active { transform: scale(0.97); }

        .cal-overlay { z-index: 1100; }
        .calendar-glass { width: 100%; max-width: 360px; background: var(--modal-bg); border-radius: 20px; padding: 20px 16px 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); border: 1px solid var(--modal-border); transform: scale(0.9); transition: transform .38s cubic-bezier(.25,.8,.25,1.15), background-color 0.4s; display: flex; flex-direction: column; align-items: center; }
        .cal-overlay.active .calendar-glass { transform: scale(1); }
        .picker-row { display: flex; margin-bottom: 18px; width: 100%; }
        .picker-col { flex: 1; display: flex; flex-direction: column; gap: 4px; height: 200px; border-right: 1px solid rgba(0,0,0,0.05); }
        .picker-col:last-child { border-right: none; }
        .picker-col label { font-weight: 600; font-size: 9px; color: var(--text-tertiary); text-align: center; }
        .picker-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; scroll-snap-type: y mandatory; background: transparent; border: none; margin: 0 2px; overscroll-behavior: none; }
        .picker-scroll::-webkit-scrollbar { display: none; }
        .picker-option { padding: 8px 4px; text-align: center; font-size: 15px; color: var(--text-secondary); cursor: pointer; margin: 1px 0; border-radius: 6px; scroll-snap-align: center; height: 36px; display: flex; align-items: center; justify-content: center; }
        .picker-option.selected { color: var(--color-deep); font-weight: 600; background: rgba(0,0,0,0.02); }
        .picker-spacer { height: 82px; scroll-snap-align: none; pointer-events: none; flex-shrink: 0; }
        .btn-row { display: flex; gap: 8px; margin-top: 12px; width: 100%; }
        .btn { flex: 1; padding: 11px; border: none; border-radius: 12px; font-weight: 600; font-size: 14px; cursor: pointer; }
        .btn-cancel { background: var(--btn-cancel-bg); color: var(--text-secondary); }
        .btn-confirm { background: var(--color-deep); color: var(--color-light1); }

        .confirm-modal .modal-glass { max-width: 300px; text-align: center; padding: 22px 18px 18px; border-radius: 20px; background: var(--modal-bg); transform: scale(0.9); transition: transform .38s cubic-bezier(.25,.8,.25,1.15), background-color 0.4s; }
        .confirm-modal.active .modal-glass { transform: scale(1); }
        .confirm-modal .modal-body { font-size: 13px; color: var(--text-secondary); margin: 4px 0 14px; }
        .confirm-modal .modal-footer { display: flex; gap: 8px; }
        .confirm-modal .modal-footer button { flex: 1; padding: 11px; border: none; border-radius: 9999px; font-weight: 600; font-size: 14px; cursor: pointer; }
        .btn-cancel-confirm { background: var(--btn-cancel-bg); color: var(--text-secondary); }
        .btn-danger { background: var(--color-deep); color: #fff; }

        @keyframes shake { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-8px)} 40%,80%{transform:translateX(8px)} }

        @media (max-width: 360px) {
            .app-container { padding: 12px 10px 0; gap: 10px; }
            .hero-card { padding: 12px 14px 14px; }
            .swipe-wrapper { height: 54px; }
            .modal-glass, .calendar-glass { max-width: 100%; }
        }
    </style>
</head>
<body>
    <div class="app-container" id="appContainer">
        <div class="header">
            <div class="header-left">
                <div class="header-brand" id="headerBrand">iFamily</div>
                <div class="header-subtitle">珍藏每一个重要时刻</div>
            </div>
            <button class="header-add-btn" id="headerAddBtn" title="添加纪念日" aria-label="添加纪念日">
                <span>+</span>
            </button>
        </div>

        <div class="hero-card" id="heroCard">
            <div class="event-name" id="heroName"></div>
            <div class="event-date-sub" id="heroDateSub"></div>
            <div class="hero-days-row">
                <div class="hero-days-item">
                    <div class="hero-days-num" id="heroDaysPassed">—</div>
                    <div class="hero-days-label" id="heroDaysPassedLabel">已过天数</div>
                </div>
                <div class="hero-days-item">
                    <div class="hero-days-num" id="heroDaysRemain">—</div>
                    <div class="hero-days-label" id="heroDaysRemainLabel">剩余天数</div>
                </div>
            </div>
        </div>

        <div id="eventList" role="list" aria-live="polite" aria-label="纪念日列表"></div>

        <div class="empty-state" id="emptyState">
            <div class="empty-illustration">
                <svg viewBox="0 0 80 80">
                    <circle cx="40" cy="40" r="28" stroke="currentColor" stroke-width="1.5" fill="none"/>
                    <path d="M40 12 L40 68 M12 40 L68 40" stroke="currentColor" stroke-width="1.5" opacity="0.25"/>
                    <circle cx="40" cy="40" r="5" fill="currentColor" opacity="0.35"/>
                    <path d="M30 30 L36 36 M50 30 L44 36 M30 50 L36 44 M50 50 L44 44" stroke="currentColor" stroke-width="1.2" opacity="0.35"/>
                </svg>
            </div>
            <div class="empty-text">开始记录吧</div>
            <div class="empty-sub">还没有纪念日，点击下方按钮记录你的第一个重要时刻吧。</div>
            <button class="empty-tap-hint" id="emptyTapHint">📝 添加第一个纪念日</button>
        </div>
    </div>

    <div class="modal-overlay" id="addModal">
        <div class="modal-glass">
            <button class="modal-close-btn" id="addCloseBtn" aria-label="关闭">
                <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
            <div class="modal-title" id="addModalTitle">记录纪念日</div>
            <div class="input-group">
                <label>名称</label>
                <input type="text" id="addName" placeholder="例如：结婚纪念日" maxlength="30" autocomplete="off" enterkeyhint="done">
            </div>
            <div class="input-group">
                <label>日期</label>
                <div class="date-trigger" id="dateTrigger" tabindex="0" role="button" aria-label="选择日期">
                    <span class="label-text">点击选择</span>
                    <span class="value" id="selectedDateText"></span>
                </div>
            </div>
            <button class="btn-submit" id="addSubmit">保存</button>
        </div>
    </div>

    <div class="modal-overlay cal-overlay" id="calendarModal">
        <div class="calendar-glass">
            <div class="cal-title">选择日期</div>
            <div class="picker-row">
                <div class="picker-col"><label>年</label><div class="picker-scroll" id="pickerYear"></div></div>
                <div class="picker-col"><label>月</label><div class="picker-scroll" id="pickerMonth"></div></div>
                <div class="picker-col"><label>日</label><div class="picker-scroll" id="pickerDay"></div></div>
            </div>
            <div class="btn-row">
                <button class="btn btn-cancel" id="calCancel">取消</button>
                <button class="btn btn-confirm" id="calConfirm">确定</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay confirm-modal" id="confirmModal">
        <div class="modal-glass">
            <div class="modal-title">确认删除</div>
            <div class="modal-body" id="confirmMessage">确定要删除这条记录吗？</div>
            <div class="modal-footer">
                <button class="btn-cancel-confirm" id="confirmCancel">取消</button>
                <button class="btn-danger" id="confirmOk">删除</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const SWIPE_DIST = 72;
            const SWIPE_THRESHOLD = 30;
            const LONG_PRESS_DURATION = 600;
            const THEME_PRESS_DURATION = 500;
            const SCROLL_SNAP_DELAY = 80;
            const PICKER_START_YEAR = 1980;
            const PICKER_END_YEAR = 2050;
            const STORAGE_KEY = 'myfamily_v53';
            const THEME_KEY = 'ifamily_theme';

            const themes = ['default', 'klein', 'peach', 'brown', 'grey', 'ice', 'violet', 'ocean', 'forest', 'orange'];

            const dom = {
                eventList: document.getElementById('eventList'),
                emptyState: document.getElementById('emptyState'),
                emptyTapHint: document.getElementById('emptyTapHint'),
                heroCard: document.getElementById('heroCard'),
                heroName: document.getElementById('heroName'),
                heroDateSub: document.getElementById('heroDateSub'),
                heroDaysPassed: document.getElementById('heroDaysPassed'),
                heroDaysPassedLabel: document.getElementById('heroDaysPassedLabel'),
                heroDaysRemain: document.getElementById('heroDaysRemain'),
                heroDaysRemainLabel: document.getElementById('heroDaysRemainLabel'),
                headerAddBtn: document.getElementById('headerAddBtn'),
                headerBrand: document.getElementById('headerBrand'),
                addModal: document.getElementById('addModal'),
                addCloseBtn: document.getElementById('addCloseBtn'),
                addName: document.getElementById('addName'),
                addSubmit: document.getElementById('addSubmit'),
                addModalTitle: document.getElementById('addModalTitle'),
                dateTrigger: document.getElementById('dateTrigger'),
                selectedDateText: document.getElementById('selectedDateText'),
                calendarModal: document.getElementById('calendarModal'),
                calCancel: document.getElementById('calCancel'),
                calConfirm: document.getElementById('calConfirm'),
                pickerYear: document.getElementById('pickerYear'),
                pickerMonth: document.getElementById('pickerMonth'),
                pickerDay: document.getElementById('pickerDay'),
                confirmModal: document.getElementById('confirmModal'),
                confirmCancel: document.getElementById('confirmCancel'),
                confirmOk: document.getElementById('confirmOk'),
                confirmMessage: document.getElementById('confirmMessage'),
                appContainer: document.getElementById('appContainer'),
            };

            let events = [];
            let currentDateStr = '';
            let pendingDeleteId = null;
            let openWrapper = null;
            let editingId = null;
            let pickerYearVal, pickerMonthVal, pickerDayVal;
            let longPressTimer = null;
            let heroPressStart = null;
            let longPressTriggered = false;
            const scrollListeners = new Map();

            function pad(n) { return String(n).padStart(2, '0'); }
            function fmt(y, m, d) { return y + '-' + pad(m) + '-' + pad(d); }
            function parseDate(s) { const p = s.split('-').map(Number); return { year: p[0], month: p[1], day: p[2] }; }
            function today() { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
            function daysBetween(a, b) { return Math.round((b.getTime() - a.getTime()) / 86400000); }
            function getDaysInMonth(y, m) { return new Date(y, m, 0).getDate(); }
            function isLeapYear(y) { return (y % 4 === 0 && y % 100 !== 0) || (y % 400 === 0); }
            function safeDate(year, month, day) {
                if (month === 2 && day === 29 && !isLeapYear(year)) return new Date(year, 1, 28);
                return new Date(year, month - 1, day);
            }

            function calcEventInfo(event) {
                const t = today();
                const d = parseDate(event.date);
                const origDate = safeDate(d.year, d.month, d.day);
                const daysPassed = daysBetween(origDate, t);
                const thisYearTarget = safeDate(t.getFullYear(), d.month, d.day);
                const nextTarget = thisYearTarget >= t ? thisYearTarget : safeDate(t.getFullYear() + 1, d.month, d.day);
                const daysRemain = daysBetween(t, nextTarget);
                const prevTarget = safeDate(nextTarget.getFullYear() - 1, d.month, d.day);
                const totalDaysInCycle = daysBetween(prevTarget, nextTarget);
                const progress = totalDaysInCycle > 0 ? Math.min(1, Math.max(0, (totalDaysInCycle - daysRemain) / totalDaysInCycle)) : 1;
                const isToday = daysRemain === 0;
                const isFuture = daysPassed < 0;
                let displayMonth = d.month, displayDay = d.day;
                if (d.month === 2 && d.day === 29 && !isLeapYear(d.year)) displayDay = 28;
                const origDateStr = d.year + '年' + displayMonth + '月' + displayDay + '日';
                return { daysPassed, daysRemain, isToday, progress, origDateStr, isFuture };
            }

            function sortEvents() {
                events.sort((a, b) => {
                    const ia = calcEventInfo(a), ib = calcEventInfo(b);
                    if (ia.isToday && !ib.isToday) return -1;
                    if (!ia.isToday && ib.isToday) return 1;
                    return ia.daysRemain - ib.daysRemain;
                });
            }

            function getHeroEvent() { return events.length ? events[0] : null; }
            function save() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(events)); } catch (e) {} }
            function load() {
                try { const raw = localStorage.getItem(STORAGE_KEY); events = raw ? JSON.parse(raw).filter(e => e && e.id && e.name && e.date) : []; } catch (e) { events = []; }
                sortEvents();
            }

            function applyTheme(theme) {
                document.body.setAttribute('data-theme', theme === 'default' ? '' : theme);
                const meta = document.querySelector('meta[name="theme-color"]');
                if (meta) {
                    const style = getComputedStyle(document.body);
                    meta.setAttribute('content', style.getPropertyValue('--bg-color').trim() || '#FDF3E5');
                }
                localStorage.setItem(THEME_KEY, theme);
            }

            function switchTheme() {
                const current = localStorage.getItem(THEME_KEY) || 'default';
                let newTheme;
                do {
                    newTheme = themes[Math.floor(Math.random() * themes.length)];
                } while (newTheme === current && themes.length > 1);
                applyTheme(newTheme);
            }

            (function initTheme() {
                const saved = localStorage.getItem(THEME_KEY);
                applyTheme(saved && themes.includes(saved) ? saved : 'default');
            })();

            (function initThemeToggle() {
                let pressTimer;
                const brand = dom.headerBrand;
                brand.addEventListener('touchstart', () => {
                    pressTimer = setTimeout(() => {
                        brand.classList.add('pressed');
                        switchTheme();
                        if (navigator.vibrate) navigator.vibrate(15);
                        setTimeout(() => brand.classList.remove('pressed'), 200);
                    }, THEME_PRESS_DURATION);
                }, { passive: true });
                brand.addEventListener('touchend', () => { clearTimeout(pressTimer); brand.classList.remove('pressed'); });
                brand.addEventListener('touchcancel', () => { clearTimeout(pressTimer); brand.classList.remove('pressed'); });
            })();

            function updateEmptyMode() { dom.appContainer.classList.toggle('empty-mode', events.length === 0); }
            function updateBodyScroll() {
                const anyOpen = dom.addModal.classList.contains('active') || dom.calendarModal.classList.contains('active') || dom.confirmModal.classList.contains('active');
                document.body.style.overflow = anyOpen ? 'hidden' : '';
            }

            function renderAll() {
                updateEmptyMode();
                if (!events.length) {
                    dom.heroCard.style.display = 'none';
                    dom.eventList.innerHTML = '';
                    dom.emptyState.classList.add('show');
                    updateBodyScroll();
                    return;
                }
                dom.emptyState.classList.remove('show');
                dom.heroCard.style.display = 'flex';
                renderHero(getHeroEvent());
                renderList();
                updateBodyScroll();
            }

            function renderHero(event) {
                const info = calcEventInfo(event);
                dom.heroName.textContent = event.name;
                dom.heroDateSub.textContent = info.origDateStr;
                if (info.isFuture) {
                    dom.heroDaysPassed.textContent = '未到';
                    dom.heroDaysPassed.className = 'hero-days-num future-num';
                    dom.heroDaysPassedLabel.textContent = '尚未到来';
                } else {
                    dom.heroDaysPassed.textContent = info.daysPassed;
                    dom.heroDaysPassed.className = 'hero-days-num';
                    dom.heroDaysPassedLabel.textContent = '已过天数';
                }
                if (info.isToday) {
                    dom.heroDaysRemain.textContent = '今天 🎉';
                    dom.heroDaysRemain.className = 'hero-days-num today-num';
                    dom.heroDaysRemainLabel.textContent = '就是今天';
                } else {
                    dom.heroDaysRemain.textContent = info.daysRemain;
                    dom.heroDaysRemain.className = 'hero-days-num';
                    dom.heroDaysRemainLabel.textContent = '剩余天数';
                }
            }

            function renderList() {
                closeAllSwipe();
                const list = dom.eventList;
                list.innerHTML = '';
                const fragment = document.createDocumentFragment();
                const circumference = 2 * Math.PI * 14;

                events.slice(1).forEach(e => {
                    const info = calcEventInfo(e);
                    const dashOffset = circumference * (1 - info.progress);

                    const wrapper = document.createElement('div');
                    wrapper.className = 'swipe-wrapper';
                    wrapper.dataset.id = e.id;
                    const inner = document.createElement('div');
                    inner.className = 'swipe-inner';

                    const content = document.createElement('div');
                    content.className = 'card-content';

                    const ringDiv = document.createElement('div');
                    ringDiv.className = 'card-ring';
                    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                    svg.setAttribute('viewBox', '0 0 34 34');
                    const bgCircle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                    bgCircle.setAttribute('cx', '17'); bgCircle.setAttribute('cy', '17'); bgCircle.setAttribute('r', '14'); bgCircle.setAttribute('class', 'ring-bg');
                    const fgCircle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                    fgCircle.setAttribute('cx', '17'); fgCircle.setAttribute('cy', '17'); fgCircle.setAttribute('r', '14'); fgCircle.setAttribute('class', 'ring-fg');
                    fgCircle.setAttribute('stroke-dasharray', circumference.toFixed(2));
                    fgCircle.setAttribute('stroke-dashoffset', circumference.toFixed(2));
                    fgCircle.dataset.target = dashOffset.toFixed(2);
                    svg.appendChild(bgCircle); svg.appendChild(fgCircle);
                    ringDiv.appendChild(svg);
                    content.appendChild(ringDiv);

                    const center = document.createElement('div');
                    center.className = 'card-center';
                    center.innerHTML = `<div class="card-name">${e.name}</div><div class="card-date">${info.origDateStr}</div>`;
                    content.appendChild(center);

                    const right = document.createElement('div');
                    right.className = 'card-right';
                    const passedBadge = document.createElement('div');
                    passedBadge.className = 'badge passed-badge';
                    passedBadge.innerHTML = info.isFuture
                        ? `<span class="badge-label">未到</span><span class="badge-number future-badge-number">—</span>`
                        : `<span class="badge-label">已过</span><span class="badge-number">${info.daysPassed}</span>`;
                    right.appendChild(passedBadge);

                    const remainBadge = document.createElement('div');
                    remainBadge.className = `badge ${info.isToday ? 'today-badge' : 'remain-badge'}`;
                    remainBadge.innerHTML = info.isToday
                        ? `<span class="badge-label">今天</span><span class="badge-number">🎉</span>`
                        : `<span class="badge-label">剩余</span><span class="badge-number">${info.daysRemain}</span>`;
                    right.appendChild(remainBadge);
                    content.appendChild(right);
                    inner.appendChild(content);

                    const del = document.createElement('div');
                    del.className = 'swipe-delete'; del.dataset.id = e.id;
                    del.innerHTML = '<div class="delete-circle"><svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg><span class="delete-label">删除</span></div>';
                    inner.appendChild(del);
                    wrapper.appendChild(inner);
                    fragment.appendChild(wrapper);
                });
                list.appendChild(fragment);
                document.querySelectorAll('.swipe-wrapper').forEach(w => initSwipe(w));

                requestAnimationFrame(() => {
                    document.querySelectorAll('.ring-fg[data-target]').forEach(ring => {
                        const target = parseFloat(ring.dataset.target);
                        ring.style.transition = 'none';
                        ring.style.strokeDashoffset = circumference;
                        requestAnimationFrame(() => {
                            ring.style.transition = 'stroke-dashoffset 0.9s cubic-bezier(0.4, 0, 0.2, 1)';
                            ring.style.strokeDashoffset = target;
                        });
                    });
                });
            }

            dom.eventList.addEventListener('click', e => {
                const del = e.target.closest('.swipe-delete');
                if (del) {
                    e.stopPropagation();
                    const id = del.dataset.id;
                    if (id) {
                        pendingDeleteId = id;
                        const evt = events.find(ev => ev.id === id);
                        dom.confirmMessage.textContent = evt ? `确定要删除「${evt.name}」吗？` : '确定要删除这条记录吗？';
                        dom.confirmModal.classList.add('active');
                        updateBodyScroll();
                        if (navigator.vibrate) navigator.vibrate(15);
                    }
                    return;
                }
                const card = e.target.closest('.card-content');
                if (card) {
                    const wrapper = card.closest('.swipe-wrapper');
                    if (wrapper?.classList.contains('open')) return;
                    const id = wrapper?.dataset.id;
                    if (id) openEdit(id);
                }
            });

            function closeAllSwipe() {
                if (openWrapper) {
                    openWrapper.classList.remove('open');
                    const inner = openWrapper.querySelector('.swipe-inner');
                    if (inner) { inner.style.transition = ''; inner.style.transform = 'translateX(0)'; }
                    openWrapper = null;
                }
            }

            function initSwipe(w) {
                const inner = w.querySelector('.swipe-inner');
                if (!inner) return;
                let startX = 0, startY = 0, lastX = 0, isDragging = false, isHorizontal = false;
                const reset = () => {
                    isDragging = false; isHorizontal = false;
                    inner.style.transition = ''; inner.style.transform = 'translateX(0)';
                    w.classList.remove('open'); openWrapper = null;
                };
                w.addEventListener('touchstart', e => {
                    if (e.touches.length !== 1) return;
                    startX = e.touches[0].clientX; startY = e.touches[0].clientY; lastX = startX;
                    isDragging = true; isHorizontal = false; inner.style.transition = 'none';
                }, { passive: true });
                w.addEventListener('touchmove', e => {
                    if (!isDragging) return;
                    const dx = e.touches[0].clientX - startX, dy = e.touches[0].clientY - startY;
                    if (!isHorizontal && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) isHorizontal = Math.abs(dx) > Math.abs(dy);
                    if (!isHorizontal) return;
                    e.preventDefault();
                    lastX = e.touches[0].clientX;
                    const open = w.classList.contains('open');
                    const offset = open ? Math.max(-SWIPE_DIST, Math.min(0, dx - SWIPE_DIST)) : Math.max(-SWIPE_DIST, Math.min(0, dx));
                    inner.style.transform = `translateX(${offset}px)`;
                }, { passive: false });
                w.addEventListener('touchend', () => {
                    if (!isDragging) return;
                    isDragging = false; inner.style.transition = '';
                    if (!isHorizontal) { inner.style.transform = 'translateX(0)'; return; }
                    if (lastX - startX < -SWIPE_THRESHOLD) {
                        if (openWrapper && openWrapper !== w) closeAllSwipe();
                        w.classList.add('open'); openWrapper = w;
                        inner.style.transform = `translateX(-${SWIPE_DIST}px)`;
                        if (navigator.vibrate) navigator.vibrate(8);
                    } else {
                        w.classList.remove('open'); inner.style.transform = 'translateX(0)';
                        if (openWrapper === w) openWrapper = null;
                    }
                });
                w.addEventListener('touchcancel', reset);
            }

            function initHeroLongPress() {
                const card = dom.heroCard; if (!card) return;
                const cancel = () => { clearTimeout(longPressTimer); card.classList.remove('long-press-hint'); heroPressStart = null; };
                card.addEventListener('touchstart', e => {
                    if (e.touches.length !== 1) return; cancel(); longPressTriggered = false;
                    heroPressStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                    longPressTimer = setTimeout(() => {
                        card.classList.add('long-press-hint'); longPressTriggered = true;
                        if (navigator.vibrate) navigator.vibrate(20);
                        const hero = getHeroEvent();
                        if (hero) { pendingDeleteId = hero.id; dom.confirmMessage.textContent = `确定要删除「${hero.name}」吗？`; dom.confirmModal.classList.add('active'); updateBodyScroll(); }
                        longPressTimer = null;
                    }, LONG_PRESS_DURATION);
                }, { passive: true });
                card.addEventListener('touchmove', e => {
                    if (!heroPressStart || !longPressTimer) return;
                    if (Math.abs(e.touches[0].clientX - heroPressStart.x) > 12 || Math.abs(e.touches[0].clientY - heroPressStart.y) > 12) cancel();
                }, { passive: true });
                card.addEventListener('touchend', () => { cancel(); setTimeout(() => { longPressTriggered = false; }, 50); });
                card.addEventListener('touchcancel', () => { cancel(); longPressTriggered = false; });
                card.addEventListener('click', e => { if (longPressTriggered) { e.preventDefault(); return; } const hero = getHeroEvent(); if (hero) openEdit(hero.id); });
            }

            let removeTrap = null;
            function trapFocus(modal, firstFocusable) {
                const nodes = modal.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
                const first = nodes[0], last = nodes[nodes.length - 1];
                function handler(e) {
                    if (e.key === 'Tab') {
                        if (e.shiftKey) { if (document.activeElement === first) { e.preventDefault(); last.focus(); } }
                        else { if (document.activeElement === last) { e.preventDefault(); first.focus(); } }
                    }
                }
                modal.addEventListener('keydown', handler);
                if (firstFocusable) firstFocusable.focus();
                return () => modal.removeEventListener('keydown', handler);
            }

            function setModalActive(modal, isActive, firstFocusable) {
                modal.classList.toggle('active', isActive);
                if (isActive) removeTrap = trapFocus(modal, firstFocusable);
                else { if (removeTrap) { removeTrap(); removeTrap = null; } }
            }

            function openAdd() {
                editingId = null;
                dom.addModalTitle.textContent = '记录纪念日';
                dom.addName.value = '';
                currentDateStr = fmt(today().getFullYear(), today().getMonth() + 1, today().getDate());
                dom.selectedDateText.textContent = currentDateStr;
                setModalActive(dom.addModal, true, dom.addName);
                updateBodyScroll(); closeAllSwipe();
            }

            function openEdit(id) {
                const evt = events.find(e => e.id === id); if (!evt) return;
                editingId = id;
                dom.addModalTitle.textContent = '编辑纪念日';
                dom.addName.value = evt.name;
                currentDateStr = evt.date;
                dom.selectedDateText.textContent = currentDateStr;
                setModalActive(dom.addModal, true, dom.addName);
                updateBodyScroll(); closeAllSwipe();
            }

            function closeAdd() { setModalActive(dom.addModal, false); updateBodyScroll(); dom.addName.blur(); editingId = null; }

            function submitForm() {
                const name = dom.addName.value.trim();
                if (!name) { dom.addName.style.animation = 'shake 0.5s ease'; dom.addName.focus(); return; }
                if (!currentDateStr) return;
                if (editingId) { const evt = events.find(e => e.id === editingId); if (evt) { evt.name = name; evt.date = currentDateStr; } }
                else events.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name, date: currentDateStr });
                sortEvents(); save(); renderAll(); closeAdd(); editingId = null;
            }

            function addSpacer(container) { const s = document.createElement('div'); s.className = 'picker-spacer'; container.appendChild(s); }
            function scrollToSelected(container) {
                const selected = container.querySelector('.picker-option.selected'); if (!selected) return;
                const offset = selected.getBoundingClientRect().top - container.getBoundingClientRect().top - container.clientHeight / 2 + selected.clientHeight / 2;
                container.scrollTop += offset;
            }

            function buildPicker() {
                scrollListeners.clear();
                if (!currentDateStr || !/^\d{4}-\d{2}-\d{2}$/.test(currentDateStr)) {
                    const t = today();
                    currentDateStr = fmt(t.getFullYear(), t.getMonth() + 1, t.getDate());
                }
                const d = parseDate(currentDateStr);
                pickerYearVal = d.year; pickerMonthVal = d.month; pickerDayVal = d.day;

                dom.pickerYear.innerHTML = ''; addSpacer(dom.pickerYear);
                for (let y = PICKER_START_YEAR; y <= PICKER_END_YEAR; y++) {
                    const o = document.createElement('div'); o.className = 'picker-option' + (y === pickerYearVal ? ' selected' : ''); o.textContent = y; o.dataset.value = y; dom.pickerYear.appendChild(o);
                }
                addSpacer(dom.pickerYear);

                dom.pickerMonth.innerHTML = ''; addSpacer(dom.pickerMonth);
                for (let m = 1; m <= 12; m++) {
                    const o = document.createElement('div'); o.className = 'picker-option' + (m === pickerMonthVal ? ' selected' : ''); o.textContent = m; o.dataset.value = m; dom.pickerMonth.appendChild(o);
                }
                addSpacer(dom.pickerMonth);
                updatePickerDayOptions(true);
                requestAnimationFrame(() => { scrollToSelected(dom.pickerYear); scrollToSelected(dom.pickerMonth); scrollToSelected(dom.pickerDay); });

                setupScrollSnap(dom.pickerYear, v => { pickerYearVal = v; updatePickerDayOptions(false); });
                setupScrollSnap(dom.pickerMonth, v => { pickerMonthVal = v; updatePickerDayOptions(false); });
                setupScrollSnap(dom.pickerDay, v => { pickerDayVal = v; });
            }

            function updatePickerDayOptions(silent) {
                const maxDay = getDaysInMonth(pickerYearVal, pickerMonthVal);
                if (pickerDayVal > maxDay) pickerDayVal = maxDay;
                dom.pickerDay.innerHTML = ''; addSpacer(dom.pickerDay);
                for (let d = 1; d <= maxDay; d++) {
                    const o = document.createElement('div'); o.className = 'picker-option' + (d === pickerDayVal ? ' selected' : ''); o.textContent = d; o.dataset.value = d; dom.pickerDay.appendChild(o);
                }
                addSpacer(dom.pickerDay);
                if (!silent) requestAnimationFrame(() => scrollToSelected(dom.pickerDay));
                setupScrollSnap(dom.pickerDay, v => { pickerDayVal = v; });
            }

            function setupScrollSnap(container, onChange) {
                if (!container) return;
                if (scrollListeners.has(container)) { const prev = scrollListeners.get(container); container.removeEventListener('scroll', prev.handler); clearTimeout(prev.timer); scrollListeners.delete(container); }
                let timer;
                const handler = () => {
                    clearTimeout(timer);
                    timer = setTimeout(() => {
                        const rect = container.getBoundingClientRect(), cy = rect.top + rect.height / 2;
                        let closest = null, md = Infinity;
                        container.querySelectorAll('.picker-option').forEach(o => {
                            const or = o.getBoundingClientRect(), oc = or.top + or.height / 2, d = Math.abs(cy - oc);
                            if (d < md) { md = d; closest = o; }
                        });
                        if (closest) {
                            const v = parseInt(closest.dataset.value);
                            container.querySelectorAll('.picker-option').forEach(o => o.classList.remove('selected'));
                            closest.classList.add('selected');
                            if (onChange) onChange(v);
                        }
                    }, SCROLL_SNAP_DELAY);
                };
                container.addEventListener('scroll', handler, { passive: true });
                scrollListeners.set(container, { handler, timer });
            }

            function openCal() {
                if (!editingId) {
                    const t = today();
                    const todayStr = fmt(t.getFullYear(), t.getMonth() + 1, t.getDate());
                    if (currentDateStr !== todayStr) {
                        currentDateStr = todayStr;
                        dom.selectedDateText.textContent = currentDateStr;
                    }
                }
                buildPicker();
                setModalActive(dom.calendarModal, true, dom.calCancel);
                updateBodyScroll();
            }

            function closeCal() { setModalActive(dom.calendarModal, false); updateBodyScroll(); dom.dateTrigger.focus(); }
            function confirmCal() { currentDateStr = fmt(pickerYearVal, pickerMonthVal, pickerDayVal); dom.selectedDateText.textContent = currentDateStr; closeCal(); }
            function deleteEvent(id) { events = events.filter(e => e.id !== id); save(); sortEvents(); renderAll(); }
            function closeConfirm() { setModalActive(dom.confirmModal, false); dom.heroCard.classList.remove('long-press-hint'); pendingDeleteId = null; updateBodyScroll(); }

            dom.headerAddBtn.addEventListener('click', e => { e.stopPropagation(); openAdd(); });
            dom.addCloseBtn.addEventListener('click', closeAdd);
            dom.addSubmit.addEventListener('click', submitForm);
            dom.dateTrigger.addEventListener('click', openCal);
            dom.calCancel.addEventListener('click', closeCal);
            dom.calConfirm.addEventListener('click', confirmCal);
            dom.emptyTapHint.addEventListener('click', e => { e.stopPropagation(); openAdd(); });
            dom.confirmCancel.addEventListener('click', closeConfirm);
            dom.confirmOk.addEventListener('click', () => {
                const id = pendingDeleteId; pendingDeleteId = null;
                setModalActive(dom.confirmModal, false); dom.heroCard.classList.remove('long-press-hint'); updateBodyScroll();
                if (id) deleteEvent(id);
            });
            dom.addModal.addEventListener('click', e => { if (e.target === dom.addModal) closeAdd(); });
            dom.calendarModal.addEventListener('click', e => { if (e.target === dom.calendarModal) closeCal(); });
            dom.confirmModal.addEventListener('click', e => { if (e.target === dom.confirmModal) closeConfirm(); });
            document.addEventListener('click', e => { if (!e.target.closest('.swipe-wrapper') && !e.target.closest('.modal-overlay')) closeAllSwipe(); });
            document.addEventListener('keydown', e => {
                if (e.key === 'Escape') {
                    if (dom.calendarModal.classList.contains('active')) closeCal();
                    else if (dom.addModal.classList.contains('active')) closeAdd();
                    else if (dom.confirmModal.classList.contains('active')) closeConfirm();
                }
                if (e.key === 'Enter' && dom.addModal.classList.contains('active')) submitForm();
            });

            load();
            currentDateStr = fmt(today().getFullYear(), today().getMonth() + 1, today().getDate());
            dom.selectedDateText.textContent = currentDateStr;
            renderAll();
            initHeroLongPress();
            window.dispatchEvent(new Event('resize'));

            if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
        })();
    </script>
</body>
</html>
