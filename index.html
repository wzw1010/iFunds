<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>iFunds</title>
    <link rel="manifest" href="./manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="iFunds" />
    <link rel="apple-touch-icon" href="./icon-1024.png" />
    <meta name="theme-color" content="#0b1a33" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --radius-top: 22px;
            --radius-md: 20px;
            --radius-bottom: 18px;
            --radius-sm: 12px;
            --radius-xs: 6px;
            --radius-full: 50%;
            --color-bg: #f2f5fc;
            --color-card-bg: #ffffff;
            --color-primary: #0b1a33;
            --color-primary-light: #132b4a;
            --color-text: #0b1a33;
            --color-text-secondary: #6b7d98;
            --color-text-light: #94a3b8;
            --color-border: #e2e8f0;
            --color-positive: #D96060;
            --color-negative: #3AAD9F;
            --color-neutral: #94a3b8;
            --color-edit-border: #d0d8e0;
            --color-edit-bg: #f8fafc;
            --shadow-card: 0 4px 16px rgba(0, 0, 0, 0.08);
            --shadow-summary: 0 6px 24px rgba(0, 0, 0, 0.12);
            --decor-today: #0b1a33;
            --decor-old: #b8c8d8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        html,
        body {
            width: 100%;
            min-height: 100vh;
            background: var(--color-bg);
            display: flex;
            justify-content: center;
            padding: 4px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        body::-webkit-scrollbar {
            display: none;
        }

        .app-container {
            max-width: 480px;
            width: 100%;
            background: #ffffff;
            border-radius: var(--radius-md);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
            padding: 14px 14px 10px 14px;
            display: flex;
            flex-direction: column;
            align-self: flex-start;
            gap: 16px;
            transition: transform 0.3s ease;
        }

        #pullIndicator {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 6px 0 2px;
            font-size: 12px;
            color: var(--color-text-light);
            opacity: 0;
            height: 0;
            overflow: hidden;
            transition: opacity 0.2s ease, height 0.2s ease;
        }
        #pullIndicator.show {
            display: flex;
            opacity: 1;
            height: 36px;
        }
        #pullIndicator .arrow {
            display: inline-block;
            font-size: 16px;
            transition: transform 0.3s ease;
        }
        #pullIndicator .arrow.flip {
            transform: rotate(180deg);
        }
        #pullIndicator .status-text {
            font-weight: 500;
            font-size: 12px;
        }
        #pullIndicator .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid var(--color-border);
            border-top-color: var(--color-primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        #pullIndicator .spinner.active {
            display: inline-block;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .summary-card {
            background: linear-gradient(145deg, var(--color-primary), var(--color-primary-light));
            border-radius: var(--radius-top);
            padding: 10px 14px 8px 14px;
            color: white;
            flex-shrink: 0;
            box-shadow: var(--shadow-summary);
        }
        .summary-today {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 6px;
        }
        .summary-today .today-label {
            font-size: 13px;
            font-weight: 500;
            opacity: 0.7;
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .summary-today .today-label svg {
            width: 16px;
            height: 16px;
            stroke: rgba(255, 255, 255, 0.7);
            stroke-width: 2;
            fill: none;
        }
        .summary-today .today-value {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
            line-height: 1.2;
            margin-top: 0px;
        }
        .summary-today .today-value.positive { color: var(--color-positive); }
        .summary-today .today-value.negative { color: var(--color-negative); }
        .summary-today .today-value.neutral { color: var(--color-text-light); }
        .summary-today .today-value.privacy { color: var(--color-text-light); letter-spacing: 4px; }
        .summary-divider {
            border: none;
            border-top: 1px solid rgba(255, 255, 255, 0.10);
            margin: 0 0 6px 0;
        }
        .summary-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .summary-stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            position: relative;
            gap: 2px;
        }
        .summary-stat-item:not(:last-child)::after {
            content: '';
            position: absolute;
            right: 0;
            top: 15%;
            height: 70%;
            width: 1px;
            background: rgba(255, 255, 255, 0.12);
        }
        .summary-stat-item .stat-label-wrap {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .summary-stat-item .stat-label {
            font-size: 10px;
            opacity: 0.5;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        .summary-stat-item .stat-number {
            font-size: 14px;
            font-weight: 600;
            line-height: 1.3;
        }
        .summary-stat-item .stat-number.privacy {
            letter-spacing: 3px;
            color: var(--color-text-light) !important;
        }
        .stat-number.positive { color: var(--color-positive); }
        .stat-number.negative { color: var(--color-negative); }
        .stat-number.neutral { color: var(--color-text-light); }
        .data-timestamp {
            font-size: 10px;
            opacity: 0.5;
            text-align: center;
            margin-top: 4px;
            letter-spacing: 0.3px;
        }

        .fund-list {
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex: 1;
        }

        .fund-card {
            background: var(--color-card-bg);
            border-radius: var(--radius-md);
            padding: 10px 14px 12px 14px;
            border: 1px solid var(--color-border);
            box-shadow: var(--shadow-card);
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-shrink: 0;
            transition: box-shadow 0.2s, border-color 0.3s;
            position: relative;
            overflow: hidden;
        }
        .fund-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            border-radius: 0;
            transition: background 0.4s ease;
        }
        .fund-card.decor-today::before { background: var(--decor-today); }
        .fund-card.decor-old::before { background: var(--decor-old); }
        .fund-card.flash-update { animation: flashCard 0.6s ease; }
        @keyframes flashCard {
            0% { background: #f0f7ff; }
            50% { background: #e0edf9; }
            100% { background: var(--color-card-bg); }
        }

        .fund-row-top {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            align-items: center;
            height: 30px;
            padding-left: 10px;
            column-gap: 0;
        }
        .fund-name-wrap {
            grid-column: 1 / 3;
            min-width: 0;
            overflow: hidden;
            padding-right: 4px;
        }
        .fund-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--color-text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
        }
        .fund-code-wrap {
            grid-column: 3;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .fund-code-standalone {
            display: inline-block;
            font-weight: 400;
            font-size: 10px;
            color: var(--color-text-secondary);
            background: #f0f4fc;
            padding: 0 8px;
            border-radius: var(--radius-md);
            line-height: 18px;
            text-align: center;
        }
        .fund-right-actions {
            grid-column: 4;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            white-space: nowrap;
        }
        .fund-market-value {
            font-size: 14px;
            font-weight: 600;
            color: var(--color-text);
            display: flex;
            align-items: center;
            gap: 3px;
        }
        .coin-icon {
            font-size: 12px;
            color: var(--color-text-secondary);
            opacity: 0.7;
        }

        .fund-row-metrics {
            display: flex;
            align-items: stretch;
            padding-left: 10px;
            height: 40px;
            position: relative;
        }
        .edit-mode .fund-row-metrics { display: none; }
        .metric-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2px 0;
            position: relative;
            min-width: 0;
        }
        .metric-item:not(:last-child)::after {
            content: '';
            position: absolute;
            right: 0;
            top: 10%;
            height: 80%;
            width: 1px;
            background: #e0e5ed;
        }
        .metric-item .metric-label {
            font-size: 10px;
            font-weight: 500;
            color: var(--color-text-light);
            letter-spacing: 0.2px;
            line-height: 1.2;
        }
        .metric-item .metric-value {
            font-size: 12px;
            font-weight: 600;
            line-height: 1.3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .metric-item .metric-value.positive { color: var(--color-positive); }
        .metric-item .metric-value.negative { color: var(--color-negative); }
        .metric-item .metric-value.neutral { color: var(--color-text-light); }

        .fund-edit-area {
            display: none;
            padding: 8px 0 2px 10px;
            border-top: 1px dashed var(--color-border);
            flex-direction: column;
            gap: 6px;
        }
        .fund-edit-area.active { display: flex; }
        .edit-row {
            display: flex;
            gap: 6px;
            align-items: center;
            width: 100%;
            flex-wrap: nowrap;
        }
        .edit-row .edit-input {
            flex: 1;
            min-width: 0;
            height: 36px;
            padding: 4px 8px;
            font-size: 12px;
            font-family: inherit;
            border-radius: var(--radius-sm);
            border: 1px solid var(--color-edit-border);
            background: var(--color-edit-bg);
            color: var(--color-text);
            outline: none;
            transition: border 0.2s ease;
            -webkit-appearance: none;
            text-align: center;
        }
        .edit-row .edit-input:focus {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 2px rgba(11, 26, 51, 0.08);
        }
        .edit-row .edit-input::placeholder {
            color: var(--color-text-light);
            opacity: 0.6;
            text-align: center;
        }
        .edit-row .edit-delete-btn {
            flex: 0 0 60px;
            height: 36px;
            padding: 0 12px;
            font-size: 11px;
            font-weight: 600;
            font-family: inherit;
            border: none;
            border-radius: var(--radius-sm);
            background: var(--color-positive);
            color: #fff;
            cursor: pointer;
            transition: opacity 0.2s ease;
            white-space: nowrap;
        }
        .edit-row .edit-delete-btn:active {
            opacity: 0.6;
            transform: scale(0.96);
        }
        .edit-hint {
            font-size: 10px;
            color: var(--color-text-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 2px;
        }
        .edit-hint .current-cost {
            font-weight: 500;
            color: var(--color-text-secondary);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--color-text-secondary);
        }
        .empty-state i {
            font-size: 36px;
            color: #d5dde8;
            margin-bottom: 6px;
        }
        .empty-state p {
            font-size: 14px;
            font-weight: 500;
        }
        .empty-state .sub {
            font-size: 12px;
            opacity: 0.6;
            margin-top: 2px;
        }

        .card-block {
            background: var(--color-card-bg);
            border-radius: var(--radius-md);
            padding: 14px;
            border: 1px solid var(--color-border);
            box-shadow: var(--shadow-card);
            transition: opacity 0.3s ease, max-height 0.3s ease, padding 0.3s ease, margin 0.3s ease;
            overflow: hidden;
        }
        .card-block.edit-hidden {
            opacity: 0;
            max-height: 0;
            padding: 0 14px;
            border: none;
            margin: 0;
            pointer-events: none;
        }
        .chart-container {
            height: 170px;
            position: relative;
        }
        .chart-container canvas {
            width: 100% !important;
            height: 100% !important;
        }
        .chart-empty {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--color-text-secondary);
            font-size: 14px;
            font-weight: 500;
        }
        .analysis-empty {
            font-size: 13px;
            color: var(--color-text-light);
            text-align: center;
            padding: 30px 0;
            font-weight: 500;
        }

        .pie-chart-container {
            height: 200px;
            position: relative;
            width: 100%;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .legend-side {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-shrink: 0;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 10px;
            font-weight: 500;
            color: #334155;
            white-space: nowrap;
        }
        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .chart-canvas-wrap {
            flex: 1;
            height: 100%;
            position: relative;
        }
        .chart-canvas-wrap canvas {
            width: 100% !important;
            height: 100% !important;
        }

        .bottom-action-card {
            background: linear-gradient(145deg, var(--color-primary), var(--color-primary-light));
            border-radius: var(--radius-bottom);
            padding: 10px 6px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
            display: flex;
            align-items: stretch;
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
            margin-top: 1px;
            transition: all 0.3s ease;
            justify-content: center;
            min-height: 72px;
        }
        .bottom-action-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 30% 20%, rgba(255, 255, 255, 0.08) 0%, transparent 60%);
            pointer-events: none;
        }
        .action-btn {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            padding: 6px 4px;
            cursor: pointer;
            transition: background 0.2s ease;
            border: none;
            background: transparent;
            color: #ffffff;
            position: relative;
            border-radius: var(--radius-md);
            min-height: 52px;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            user-select: none;
        }
        .action-btn:not(:last-child)::after {
            content: '';
            position: absolute;
            right: 0;
            top: 15%;
            height: 70%;
            width: 1px;
            background: rgba(255, 255, 255, 0.12);
        }
        .action-btn:active {
            background: rgba(255, 255, 255, 0.06);
            transform: scale(0.96);
        }
        .action-btn .icon-wrap {
            width: 28px;
            height: 28px;
            border-radius: var(--radius-full);
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #ffffff;
            flex-shrink: 0;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: background 0.2s;
            will-change: transform;
            pointer-events: none;
        }
        @keyframes iconPop {
            0% { transform: scale(1); }
            35% { transform: scale(1.3); }
            60% { transform: scale(0.92); }
            100% { transform: scale(1); }
        }
        .action-btn .icon-wrap.pop {
            animation: iconPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .action-btn .label {
            font-size: 10px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.75);
            letter-spacing: 0.2px;
            white-space: nowrap;
            pointer-events: none;
        }
        .bottom-action-card.edit-mode .action-btn {
            display: none !important;
        }
        .bottom-action-card.edit-mode .action-btn.edit-highlight {
            display: flex !important;
            flex: 0 0 auto;
            padding: 8px 28px;
            background: transparent !important;
            border-radius: var(--radius-md);
        }
        .bottom-action-card.edit-mode .action-btn.edit-highlight .icon-wrap {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.08);
        }
        .bottom-action-card.edit-mode .action-btn.edit-highlight .label {
            color: rgba(255, 255, 255, 0.75);
        }
        .bottom-action-card.edit-mode .action-btn::after {
            display: none !important;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            justify-content: center;
            align-items: center;
            z-index: 999;
            padding: 0;
            box-sizing: border-box;
        }
        .modal-overlay.active {
            display: flex;
        }
        .add-modal .add-content,
        .backup-modal .backup-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 32px 24px;
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 100%;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 0;
            border: none;
            box-shadow: none;
            position: relative;
        }
        .add-modal .add-content h2,
        .backup-modal .backup-content h2 {
            font-size: 22px;
            font-weight: 700;
            color: #0b1a33;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 0px;
        }
        .add-modal .add-content h2 i,
        .backup-modal .backup-content h2 i {
            color: #0b1a33;
        }
        .sub-placeholder {
            height: 24px;
            flex-shrink: 0;
        }
        .add-modal .add-content .input-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
        }
        .add-modal .add-content .input-group input {
            width: 100%;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(4px);
            font-size: 15px;
            color: #ffffff;
            outline: none;
            transition: 0.15s;
            -webkit-appearance: none;
        }
        .add-modal .add-content .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.4);
            font-weight: 400;
            font-size: 14px;
        }
        .add-modal .add-content .input-group input:focus {
            border-color: rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.2);
        }
        .add-modal .add-content .auto-fill-info {
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-md);
            padding: 8px 14px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: none;
            margin-top: -6px;
            margin-bottom: 2px;
            text-align: center;
        }
        .add-modal .add-content .auto-fill-info.show {
            display: block;
        }
        .add-modal .add-content .modal-actions {
            display: flex;
            gap: 12px;
            width: 100%;
            justify-content: center;
            margin-top: 12px;
        }
        .add-modal .add-content .modal-actions button {
            flex: 1;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            font-size: 15px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            transition: 0.15s;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            color: #ffffff;
        }
        .add-modal .add-content .modal-actions button:active {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(0.96);
        }
        .add-modal .add-content .modal-actions .btn-cancel {
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .add-modal .add-content .modal-actions .btn-confirm:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .backup-modal .backup-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }
        .backup-modal .backup-actions button,
        .backup-modal .backup-actions .file-input-wrap {
            width: 100%;
            border-radius: var(--radius-md);
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(4px);

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <div class="check-pop" id="checkPop"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>

    <script>
        (function() {
            'use strict';

            const STORAGE_H = 'fund_holdings';
            const STORAGE_C = 'fund_data_cache';
            const STORAGE_A = 'account_profit_history';
            const STORAGE_T = 'fund_industry_tags';
            const DEEP_OCEAN = ['#1A3A4A', '#2A5F6F', '#3D7A8C', '#5A9AAA', '#7AB8C8', '#A8D0D8'];

            let holdings = {};
            let fundDataCache = {};
            let accountProfitHistory = [];
            let industryTags = {};
            let editMode = false;
            let privacyMode = false;
            let isUpdating = false;
            let profitChart = null;
            let pieChart = null;

            function getToday() {
                return new Date().toISOString().slice(0, 10);
            }

            function formatMoney(v) {
                if (v === undefined || v === null || isNaN(v)) return '--';
                return (v >= 0 ? '+' : '') + v.toFixed(2);
            }

            function round4(v) {
                return Math.round(v * 10000) / 10000;
            }

            function escapeHTML(str) {
                if (!str) return '';
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            function isTradingDay(d) {
                const day = d.getDay();
                return day !== 0 && day !== 6;
            }

            function getValidName(name, code) {
                if (name && typeof name === 'string' && name.trim().length >= 2) return name.trim();
                return code;
            }

            function loadData() {
                try { holdings = JSON.parse(localStorage.getItem(STORAGE_H)) || {}; } catch (e) { holdings = {}; }
                try { fundDataCache = JSON.parse(localStorage.getItem(STORAGE_C)) || {}; } catch (e) { fundDataCache = {}; }
                try { accountProfitHistory = JSON.parse(localStorage.getItem(STORAGE_A)) || []; } catch (e) { accountProfitHistory = []; }
                try { industryTags = JSON.parse(localStorage.getItem(STORAGE_T)) || {}; } catch (e) { industryTags = {}; }
            }

            function saveAll() {
                localStorage.setItem(STORAGE_H, JSON.stringify(holdings));
                localStorage.setItem(STORAGE_C, JSON.stringify(fundDataCache));
                localStorage.setItem(STORAGE_A, JSON.stringify(accountProfitHistory));
                localStorage.setItem(STORAGE_T, JSON.stringify(industryTags));
            }

            function hardReset() {
                const keys = Object.keys(localStorage);
                keys.forEach(key => {
                    if (key.startsWith('fund_')) localStorage.removeItem(key);
                });
                loadData();
                renderAll();
            }

            function fetchTxFund(code) {
                return new Promise((resolve, reject) => {
                    const varName = 'v_jj' + code;
                    // 强制清除旧的全局变量，避免缓存
                    try { delete window[varName]; } catch (e) {}

                    const script = document.createElement('script');
                    // 添加时间戳，确保每次都是新请求
                    script.src = 'https://qt.gtimg.cn/q=jj' + code + '?_t=' + Date.now();
                    script.async = true;
                    const tid = setTimeout(() => {
                        cleanup();
                        reject(new Error('腾讯接口超时'));
                    }, 8000);

                    function cleanup() {
                        clearTimeout(tid);
                        if (script.parentNode) script.parentNode.removeChild(script);
                        try { delete window[varName]; } catch (e) {}
                    }

                    script.onload = function() {
                        clearTimeout(tid);
                        try {
                            const raw = window[varName];
                            const data = parseTxData(raw);
                            if (data) {
                                cleanup();
                                resolve(data);
                                return;
                            }
                            cleanup();
                            reject(new Error('无法解析腾讯数据'));
                        } catch (e) {
                            cleanup();
                            reject(e);
                        }
                    };

                    script.onerror = function() {
                        cleanup();
                        reject(new Error('腾讯接口请求失败'));
                    };

                    document.head.appendChild(script);
                });
            }

            function parseTxData(raw) {
                if (typeof raw !== 'string') return null;
                const parts = raw.split('~');
                if (parts.length < 9) return null;
                const nav = parseFloat(parts[5]) || 0;
                const rate = parseFloat(parts[7]) || 0;
                const date = parts[8] || '';
                if (nav <= 0 || !date) return null;
                return { fundcode: parts[0], name: parts[1], dwjz: nav, gszzl: rate, jzrq: date };
            }

            async function fetchFundDataOnlyForce(code) {
                try {
                    const tx = await fetchTxFund(code);
                    if (tx && tx.dwjz > 0) {
                        fundDataCache[code] = {
                            name: getValidName(tx.name, code),
                            nav: tx.dwjz,
                            rate: tx.gszzl,
                            date: tx.jzrq,
                            updateDate: getToday()
                        };
                        saveAll();
                        return true;
                    }
                } catch (e) {
                    console.warn('强制刷新失败', code, e.message);
                }
                return false;
            }

            async function fetchFundDataOnly(code) {
                try {
                    const tx = await fetchTxFund(code);
                    if (tx && tx.dwjz > 0) {
                        fundDataCache[code] = {
                            name: getValidName(tx.name, code),
                            nav: tx.dwjz,
                            rate: tx.gszzl,
                            date: tx.jzrq,
                            updateDate: getToday()
                        };
                        saveAll();
                        return true;
                    }
                } catch (e) {
                    console.warn('fetch error', code, e.message);
                }
                return false;
            }

            function getDisplayData(code) {
                const cache = fundDataCache[code] || {};
                if (cache.nav && cache.date) return { nav: cache.nav, rate: cache.rate || 0, date: cache.date };
                return { nav: 0, rate: 0, date: '' };
            }

            function getCardData(code) {
                const h = holdings[code];
                if (!h) return null;
                const cost = parseFloat(h.cost) || 0;
                const shares = parseFloat(h.shares) || 0;
                const display = getDisplayData(code);
                const nav = display.nav || cost;
                const rate = display.rate || 0;
                const prev = rate !== 0 ? nav / (1 + rate / 100) : nav;
                const marketValue = nav * shares;
                const dayProfit = (nav - prev) * shares;
                const dayRate = rate;
                const holdProfit = (nav - cost) * shares;
                const holdYield = cost > 0 ? ((nav - cost) / cost * 100) : 0;
                return { name: h.name || code, code, marketValue, dayRate, dayProfit, holdProfit, holdYield, cost, shares };
            }

            function computeSummary() {
                const codes = Object.keys(holdings);
                if (!codes.length) return { totalAsset: 0, todayProfit: 0, totalProfit: 0, totalYield: 0 };
                let totalCost = 0,
                    totalMV = 0,
                    totalPrev = 0;
                codes.forEach(code => {
                    const h = holdings[code];
                    const cost = parseFloat(h.cost) || 0;
                    const shares = parseFloat(h.shares) || 0;
                    totalCost += cost * shares;
                    const display = getDisplayData(code);
                    const nav = display.nav || cost;
                    const rate = display.rate || 0;
                    const prev = rate !== 0 ? nav / (1 + rate / 100) : nav;
                    totalMV += nav * shares;
                    totalPrev += prev * shares;
                });
                const totalProfit = totalMV - totalCost;
                const todayProfit = totalMV - totalPrev;
                const totalYield = totalCost > 0 ? (totalProfit / totalCost * 100) : 0;
                return {
                    totalAsset: round4(totalMV),
                    todayProfit: round4(todayProfit),
                    totalProfit: round4(totalProfit),
                    totalYield: round4(totalYield)
                };
            }

            function getTodayProfit() {
                return computeSummary().todayProfit;
            }

            function saveTodaySnapshot() {
                const today = getToday();
                const codes = Object.keys(holdings);
                let hasTodayData = false;
                for (let code of codes) {
                    const d = getDisplayData(code);
                    if (d.date === today && d.nav > 0) {
                        hasTodayData = true;
                        break;
                    }
                }
                if (!hasTodayData) return;
                const profit = getTodayProfit();
                const existing = accountProfitHistory.findIndex(item => item.date === today);
                if (existing >= 0) {
                    accountProfitHistory[existing].profit = round4(profit);
                } else {
                    accountProfitHistory.push({ date: today, profit: round4(profit) });
                }
                accountProfitHistory.sort((a, b) => a.date.localeCompare(b.date));
                if (accountProfitHistory.length > 30) {
                    accountProfitHistory = accountProfitHistory.slice(-30);
                }
                saveAll();
            }

            function backfillProfitHistory() {
                const codes = Object.keys(holdings);
                if (!codes.length) return;
                let hasValidData = false;
                codes.forEach(code => {
                    const d = getDisplayData(code);
                    if (d.nav > 0 && d.date) hasValidData = true;
                });
                if (!hasValidData) return;
                const existingDates = new Set(accountProfitHistory.map(item => item.date));
                let lastDate = null;
                if (accountProfitHistory.length > 0) {
                    const sorted = accountProfitHistory.slice().sort((a, b) => a.date.localeCompare(b.date));
                    lastDate = sorted[sorted.length - 1].date;
                }
                let startDate = lastDate ? new Date(lastDate) : new Date();
                startDate.setDate(startDate.getDate() + 1);
                const endDate = new Date();
                endDate.setDate(endDate.getDate() - 1);
                let daysToBackfill = 0;
                const maxBackfill = 30;
                const toFill = [];
                let current = new Date(startDate);
                while (current <= endDate && daysToBackfill < maxBackfill) {
                    const dateStr = current.toISOString().slice(0, 10);
                    if (!existingDates.has(dateStr) && isTradingDay(current)) {
                        toFill.push(dateStr);
                    }
                    current.setDate(current.getDate() + 1);
                    daysToBackfill++;
                }
                if (toFill.length > 0) {
                    const currentProfit = getTodayProfit();
                    toFill.forEach(dateStr => {
                        if (!accountProfitHistory.find(item => item.date === dateStr)) {
                            accountProfitHistory.push({ date: dateStr, profit: round4(currentProfit), estimated: true });
                        }
                    });
                    accountProfitHistory.sort((a, b) => a.date.localeCompare(b.date));
                    if (accountProfitHistory.length > 30) {
                        accountProfitHistory = accountProfitHistory.slice(-30);
                    }
                    saveAll();
                }
            }

            function initPullToRefresh() {
                const container = document.getElementById('app');
                const indicator = document.getElementById('pullIndicator');
                const arrow = document.getElementById('pullArrow');
                const status = document.getElementById('pullStatus');
                const spinner = document.getElementById('pullSpinner');
                let startY = 0,
                    isPulling = false,
                    pullHeight = 0;

                container.addEventListener('touchstart', function(e) {
                    if (window.scrollY > 5) return;
                    const touch = e.touches[0];
                    startY = touch.clientY;
                    isPulling = false;
                    pullHeight = 0;
                }, { passive: true });

                container.addEventListener('touchmove', function(e) {
                    if (isUpdating) return;
                    if (window.scrollY > 5) {
                        if (isPulling) {
                            isPulling = false;
                            indicator.classList.remove('show');
                            container.style.transform = '';
                        }
                        return;
                    }
                    const touch = e.touches[0];
                    const deltaY = touch.clientY - startY;
                    if (deltaY > 0 && deltaY < 120) {
                        isPulling = true;
                        pullHeight = Math.min(deltaY * 0.4, 60);
                        container.style.transform = 'translateY(' + pullHeight + 'px)';
                        indicator.classList.add('show');
                        if (pullHeight > 30) {
                            arrow.classList.add('flip');
                            status.textContent = '释放刷新';
                        } else {
                            arrow.classList.remove('flip');
                            status.textContent = '下拉刷新';
                        }
                        e.preventDefault();
                    }
                }, { passive: false });

                container.addEventListener('touchend', function(e) {
                    if (!isPulling || isUpdating) {
                        container.style.transform = '';
                        indicator.classList.remove('show');
                        return;
                    }
                    isPulling = false;
                    if (pullHeight > 30) {
                        isUpdating = true;
                        arrow.classList.remove('flip');
                        arrow.style.display = 'none';
                        spinner.classList.add('active');
                        status.textContent = '刷新中...';
                        container.style.transform = 'translateY(36px)';
                        refreshData().then(function() {
                            isUpdating = false;
                            arrow.style.display = 'inline';
                            spinner.classList.remove('active');
                            status.textContent = '刷新完成';
                            container.style.transform = '';
                            setTimeout(function() { indicator.classList.remove('show'); }, 600);
                        }).catch(function() {
                            isUpdating = false;
                            arrow.style.display = 'inline';
                            spinner.classList.remove('active');
                            status.textContent = '刷新失败';
                            container.style.transform = '';
                            setTimeout(function() { indicator.classList.remove('show'); }, 800);
                        });
                    } else {
                        container.style.transform = '';
                        indicator.classList.remove('show');
                    }
                    pullHeight = 0;
                }, { passive: true });
            }

                    const tag = industryTags[code] || '未分类';

                showCheck();

                try {
                    const codes = Object.keys(holdings);
                    if (codes.length) {
                        for (let i = 0; i < codes.length; i++) {
                            await fetchFundDataOnlyForce(codes[i]);

            function exitEditMode() {
                const codes = Object.keys(holdings);
                let changed = false;
                codes.forEach(code => {
                    const ci = document.getElementById('editCost_' + code);
                    const si = document.getElementById('editShares_' + code);
                    const ti = document.getElementById('editTag_' + code);
                    if (ci && si) {
                        const nc = parseFloat(ci.value);
                        const ns = parseFloat(si.value);
                        const nt = ti ? ti.value.trim() : '';
                        if (!isNaN(nc) && nc > 0 && !isNaN(ns) && ns > 0) {
                            const roundedCost = round4(nc);
                            const roundedShares = round4(ns);
                            if (holdings[code].cost !== roundedCost || holdings[code].shares !== roundedShares) {
                                holdings[code].cost = roundedCost;
                                holdings[code].shares = roundedShares;
                                changed = true;
                            }
                            if (industryTags[code] !== nt) {
                                if (nt) { industryTags[code] = nt; } else { delete industryTags[code]; }
                                changed = true;
                            }
                        }
                    }
                });
                if (changed) { saveAll(); refreshData(); }
                editMode = false;
                renderAll();
            }

            let promptResolve = null;

            function showPrompt(title, msg, btns) {
                if (promptResolve) { promptResolve(null); promptResolve = null; }
                return new Promise(resolve => {
                    promptResolve = resolve;
                    promptTitle.textContent = title || '提示';
                    promptMessage.textContent = msg || '';
                    promptActions.innerHTML = '';
                    btns.forEach(b => {
                        const el = document.createElement('button');
                        el.textContent = b.text;
                        el.className = b.cls || 'btn-confirm';
                        el.onclick = () => {
                            promptOverlay.classList.remove('active');
                            const cb = promptResolve;
                            promptResolve = null;
                            if (cb) cb(b.value);
                        };
                        promptActions.appendChild(el);
                    });
                    promptOverlay.classList.add('active');
                });
            }

            function showAlert(msg) { return showPrompt('提示', msg, [{ text: '确定', cls: 'btn-confirm', value: true }]); }

            function showConfirm(msg) {
                return showPrompt('确认', msg, [
                    { text: '取消', cls: 'btn-cancel', value: false },
                    { text: '确定', cls: 'btn-danger', value: true }
                ]);
            }

            promptOverlay.addEventListener('click', function(e) {
                if (e.target === promptOverlay && promptResolve) {
                    promptOverlay.classList.remove('active');
                    const cb = promptResolve;
                    promptResolve = null;
                    if (cb) cb(null);
                }
            });

                            fetchTxFund(code).then(data => {
                                if (data && data.name) {
                                    fetchName = data.name;
                                    infoText.textContent = '已识别：' + data.name;
                                    infoBox.classList.add('show');
                                    confirmBtn.disabled = false;
                                } else {
                                    infoBox.classList.remove('show');
                                    confirmBtn.disabled = true;
                                    fetchName = '';
                                }
                            }).catch(() => {
                                infoBox.classList.remove('show');
                                confirmBtn.disabled = true;
                                fetchName = '';
                            });
                        }, 400);
                    } else {
                        infoBox.classList.remove('show');
                        confirmBtn.disabled = true;
                        fetchName = '';
                    }
                });

                confirmBtn.addEventListener('click', async function() {
                    if (this.disabled) return;
                    this.disabled = true;
                    try {
                        const code = codeInput.value.trim();
                        const cost = parseFloat(costInput.value);
                        const shares = parseFloat(sharesInput.value);
                        const industry = industryInput.value.trim();
                        if (code.length !== 6 || !/^\d{6}$/.test(code)) { await showAlert('请输入6位数字代码'); return; }
                        if (isNaN(cost) || cost <= 0) { await showAlert('请输入有效成本价'); return; }
                        if (isNaN(shares) || shares <= 0) { await showAlert('请输入有效份额'); return; }
                        if (!industry) { await showAlert('请输入行业标签'); return; }
                        let name = fetchName;
                        if (!name) { try { const d = await fetchTxFund(code); if (d && d.name) name = d.name; } catch (e) {} }
                        if (!name) { await showAlert('未能识别基金代码，请检查网络后重试'); return; }
                        if (holdings[code]) { const overwrite = await showConfirm('已存在 ' + name + '，是否覆盖？'); if (!overwrite) return; }
                        holdings[code] = { cost: round4(cost), shares: round4(shares), name };
                        industryTags[code] = industry;
                        saveAll();
                        closeModal();
                        await fetchFundDataOnly(code);
                        renderAll();
                    } catch (err) {
                        console.error('添加失败:', err);
                        await showAlert('添加失败，请重试');
                    } finally {
                        this.disabled = false;
                    }
                });
            }

            function setupBackup() {
                const overlay = document.getElementById('backupModalOverlay');
                const exportBtn = document.getElementById('exportBtn');
                const importInput = document.getElementById('importFileInput');
                const clearCacheBtn = document.getElementById('clearCacheBtn');
                const hardResetBtn = document.getElementById('hardResetBtn');
                const closeCircle = document.getElementById('closeBackupModalBtnCircle');

                document.getElementById('openBackupModalBtn').addEventListener('click', function() {
                    if (editMode) { showAlert('请先完成编辑'); return; }
                    const icon = document.querySelector('#openBackupModalBtn .icon-wrap');
                    if (icon) { icon.classList.remove('pop'); void icon.offsetWidth; icon.classList.add('pop'); }
                    overlay.classList.add('active');
                });

                function closeModal() { overlay.classList.remove('active'); }
                closeCircle.onclick = closeModal;
                overlay.addEventListener('click', function(e) { if (e.target === overlay) closeModal(); });

                exportBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const data = JSON.stringify({ holdings, fundDataCache, accountProfitHistory, industryTags }, null, 2);
                    const blob = new Blob([data], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'iFunds_backup_' + getToday() + '.json';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                });

                importInput.addEventListener('change', async function(e) {
                    e.stopPropagation();
                    const file = this.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = async function(ev) {
                        try {
                            const data = JSON.parse(ev.target.result);
                            if (!data.holdings || typeof data.holdings !== 'object') {
                                await showAlert('配置格式无效，缺少持仓数据');
                                return;
                            }
                            const ok = await showConfirm('将导入 ' + Object.keys(data.holdings).length + ' 只基金，覆盖当前数据？');
                            if (ok) {
                                holdings = data.holdings || {};
                                fundDataCache = data.fundDataCache || {};
                                accountProfitHistory = data.accountProfitHistory || [];
                                industryTags = data.industryTags || {};
                                saveAll();
                                closeModal();
                                await refreshData();
                            }
                        } catch (_) { await showAlert('文件解析失败，请确认是有效的JSON文件'); }
                    };
                    reader.readAsText(file);
                    this.value = '';
                });

                clearCacheBtn.addEventListener('click', async function(e) {
                    e.stopPropagation();
                    const ok = await showConfirm('清除所有缓存数据？（持仓配置保留）');
                    if (ok) {
                        fundDataCache = {};
                        saveAll();
                        closeModal();
                        await refreshData();
                        await showAlert('缓存已清除');
                    }
                });

                hardResetBtn.addEventListener('click', async function(e) {
                    e.stopPropagation();
                    const ok = await showConfirm('⚠️ 硬重置将清除所有基金数据并重新加载页面，确定吗？');
                    if (ok) {
                        hardReset();
                        location.reload(true);
                    }
                });
            }

            let clickCount = 0,
                clickTimer = null;

            function setupPrivacy() {
                document.getElementById('summaryCard').addEventListener('click', function(e) {
                    if (e.target.closest('button')) return;
                    clearTimeout(clickTimer);
                    clickCount++;
                    clickTimer = setTimeout(() => {
                        if (clickCount >= 3) {
                            privacyMode = !privacyMode;
                            if (privacyMode) {
                                ['todayProfitBig', 'totalAssets', 'totalProfit', 'totalReturn'].forEach(id => {
                                    const el = document.getElementById(id);
                                    if (el) { el.textContent = '***'; el.className = 'stat-number privacy'; }
                                });
                                document.getElementById('dataTimestamp').textContent = '净值日期：--';
                            } else { renderSummary(); }
                            clickCount = 0;
                        }
                    }, 400);
                });
            }

            function init() {
                loadData();
                if (Object.keys(holdings).length > 0) backfillProfitHistory();
                setupPrivacy();
                renderAll();
                if (Object.keys(holdings).length) refreshData();
                setupModal();
                setupBackup();
                initPullToRefresh();
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.register('./sw.js')
                        .then(reg => console.log('SW 注册成功'))
                        .catch(err => console.warn('SW 注册失败:', err.message));
                }
                console.log('✅ iFunds 已启动（修复 JSONP 缓存）');
            }

            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
            else init();
        })();
    </script>
</body>
</html>
